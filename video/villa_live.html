<title>فيلا الواجهة الحيّة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: full-bleed cinema canvas, a slim control strip underneath. Single dark look (screening room). */
:root{
  --bg:#14120f; --panel:#1f1b16; --line:#3a332a; --fg:#efe6d8; --muted:#a8998326; --sub:#b7a993; --accent:#d9b27c;
  --display:"Reem Kufi","Tajawal",system-ui,sans-serif; --body:"Tajawal",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);direction:rtl;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;gap:10px;box-sizing:border-box}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:1.35rem;margin:0;text-wrap:balance}
header p{margin:0;color:var(--sub);font-size:.9rem}
.stage{position:relative;flex:1;min-height:200px;border-radius:6px;overflow:hidden;background:#000;cursor:grab;touch-action:none}
.stage:active{cursor:grabbing}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tag{position:absolute;top:10px;right:12px;font-size:.75rem;letter-spacing:.06em;background:#000a;color:var(--fg);padding:4px 10px;border-radius:999px}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px}
.controls label{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--sub)}
.controls input[type=range]{accent-color:var(--accent);width:150px;max-width:40vw}
button{font:inherit;background:var(--accent);color:#1a140c;border:0;border-radius:4px;padding:7px 16px;font-weight:700;cursor:pointer}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{color:var(--sub);font-size:.8rem;margin-inline-start:auto}
</style>

<header>
  <h1>فيلا الواجهة الحيّة</h1>
  <p>حركة كاميرا سينمائية بين المنظورين، مع سيارات ومارّة متحركين</p>
</header>
<div class="stage" id="stage"><canvas id="cv"></canvas><span class="tag" id="tag">المنظور الجانبي</span></div>
<div class="controls">
  <button id="play">إيقاف</button>
  <button class="ghost" id="v1">المنظور 1</button>
  <button class="ghost" id="v2">المنظور 2</button>
  <label for="scrub">الكاميرا <input id="scrub" type="range" min="0" max="1000" value="0"></label>
  <label for="cars">السيارات <input id="cars" type="range" min="0" max="8" value="4"></label>
  <label for="ppl">المارّة <input id="ppl" type="range" min="0" max="10" value="5"></label>
  <span class="hint">اسحب على المشهد لتحريك الكاميرا</span>
</div>

  const type=Math.random()<.55?'suv':'sedan';
  const len=(lane==='near'?270:220)*rnd(.92,1.06);
  const x=spawnAnywhere?rnd(0,W):(dir<0?W+len+rnd(0,600):-len-rnd(0,600));
  return {lane,dir,type,len,x,v:rnd(150,260),color:pick(PAL)};
}
function newPerson(spawnAnywhere){
  const dir=Math.random()<.5?1:-1;
  return {dir,x:spawnAnywhere?rnd(100,W-100):(dir>0?-60-rnd(0,400):W+60+rnd(0,400)),
    v:rnd(38,58),h:rnd(118,140),ph:rnd(0,6.28),skin:pick(SKIN),top:pick(TOPS),bot:pick(BOTS),
    hair:pick(['#1c1612','#3a2a1e','#6b4a2e','#2a2420']),bag:Math.random()<.3,long:Math.random()<.4};
}
function sync(spawnAnywhere){
  const nc=+carsEl.value,np=+pplEl.value;
  while(cars.length<nc)cars.push(newCar(spawnAnywhere)); cars.length=nc;
  while(people.length<np)people.push(newPerson(spawnAnywhere)); people.length=np;
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}

function drawCar(c,base,s,reflect){
  const L=c.len*s, Hb=L*(c.type==='suv'?.26:.21), x=c.x, y=base;
  ctx.save(); ctx.translate(x,y); if(c.dir>0) ctx.scale(-1,1); // nose faces travel direction (-x)
  if(reflect){ctx.scale(1,-1);ctx.globalAlpha*=.22;}
  if(!reflect){ // contact shadow
    const g=ctx.createRadialGradient(0,0,0,0,0,L*.6);g.addColorStop(0,'rgba(0,0,0,.45)');g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,L*.58,L*.05,0,0,7);ctx.fill();
  }
  const wr=L*.085, cab=c.type==='suv'?Hb*.85:Hb*.75;
  // body
  ctx.fillStyle=c.color; ctx.beginPath();
  ctx.moveTo(-L/2,-wr*.9); ctx.quadraticCurveTo(-L/2-2,-Hb*.95,-L*.42,-Hb);
  ctx.lineTo(-L*.28,-Hb*1.02); ctx.quadraticCurveTo(-L*.18,-Hb-cab,-L*.05,-Hb-cab);
  ctx.lineTo(L*.3,-Hb-cab*(c.type==='suv'?.98:.9)); ctx.quadraticCurveTo(L*.44,-Hb-cab*.6,L*.48,-Hb*.95);
  ctx.quadraticCurveTo(L/2+2,-Hb*.5,L/2,-wr*.9); ctx.closePath(); ctx.fill();
  // body sheen
  const sh=ctx.createLinearGradient(0,-Hb-cab,0,0);sh.addColorStop(0,'rgba(255,255,255,.28)');sh.addColorStop(.5,'rgba(255,255,255,0)');sh.addColorStop(1,'rgba(0,0,0,.35)');
  ctx.fillStyle=sh;ctx.fill();
  // windows
  ctx.fillStyle='rgba(20,26,32,.88)'; ctx.beginPath();
  ctx.moveTo(-L*.24,-Hb*1.04); ctx.quadraticCurveTo(-L*.16,-Hb-cab*.88,-L*.05,-Hb-cab*.88);
  ctx.lineTo(L*.28,-Hb-cab*.84); ctx.quadraticCurveTo(L*.39,-Hb-cab*.5,L*.42,-Hb*1.04); ctx.closePath(); ctx.fill();
  ctx.fillStyle=c.color; ctx.fillRect(L*.06,-Hb-cab*.9,L*.025,cab*.9); // B pillar
  // lights: head (front = -x), tail (+x)
  ctx.fillStyle='#fff6dc'; rr(-L/2+2,-Hb*.78,L*.05,Hb*.14,3); ctx.fill();
  ctx.fillStyle='#e0262b'; rr(L/2-L*.045,-Hb*.82,L*.04,Hb*.16,3); ctx.fill();
  if(!reflect){
    ctx.globalCompositeOperation='lighter';
    let g=ctx.createRadialGradient(L/2,-Hb*.74,0,L/2,-Hb*.74,L*.14);g.addColorStop(0,'rgba(255,40,40,.55)');g.addColorStop(1,'rgba(255,0,0,0)');
    ctx.fillStyle=g;ctx.fillRect(L/2-L*.14,-Hb*.74-L*.14,L*.28,L*.28);
    g=ctx.createRadialGradient(-L/2,-Hb*.7,0,-L/2,-Hb*.7,L*.18);g.addColorStop(0,'rgba(255,240,200,.5)');g.addColorStop(1,'rgba(255,240,200,0)');
    ctx.fillStyle=g;ctx.fillRect(-L/2-L*.18,-Hb*.7-L*.18,L*.36,L*.36);
    ctx.globalCompositeOperation='source-over';
  }
  // wheels with spin blur
  for(const wx of[-L*.31,L*.31]){
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(wx,-wr,wr,0,7);ctx.fill();
    ctx.fillStyle='#8d9094';ctx.beginPath();ctx.arc(wx,-wr,wr*.58,0,7);ctx.fill();
    ctx.fillStyle='#55585c';ctx.beginPath();ctx.arc(wx,-wr,wr*.22,0,7);ctx.fill();
  }
  ctx.restore();
}

function drawPerson(p,feet,s,t){
  const h=p.h*s, ph=p.ph+t*p.v*.11, sw=Math.sin(ph), bob=Math.abs(Math.cos(ph))*h*.012;
  ctx.save(); ctx.translate(p.x,feet-bob); if(p.dir<0) ctx.scale(-1,1);
  // shadow
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(0,bob,h*.16,h*.025,0,0,7);ctx.fill();
  const hip=-h*.5, sh=-h*.82, lw=h*.075;
  ctx.lineCap='round';
  const leg=(a,col)=>{ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(0,hip);
    const kx=Math.sin(a)*h*.13, kne=hip+h*.24; ctx.lineTo(kx,kne);
    ctx.lineTo(kx+Math.sin(a)*h*.06-Math.max(0,-a)*h*.05,-h*.02);ctx.stroke();
    ctx.fillStyle='#f2f2f2';ctx.fillRect(kx+Math.sin(a)*h*.06-Math.max(0,-a)*h*.05-lw*.4,-h*.035,lw*1.6,h*.035);};
  const arm=(a,col)=>{ctx.strokeStyle=col;ctx.lineWidth=lw*.8;ctx.beginPath();ctx.moveTo(0,sh+h*.03);
    ctx.lineTo(Math.sin(a)*h*.1,sh+h*.2);ctx.lineTo(Math.sin(a)*h*.15+h*.02,sh+h*.36);ctx.stroke();};
  const dark=c=>c;
  arm(-sw*.7,'rgba(0,0,0,.25)'); leg(-sw*.6,p.bot); ctx.globalAlpha=1;
  // torso
  ctx.fillStyle=p.top; rr(-h*.075,sh,h*.15,(p.long?h*.42:h*.34),h*.05); ctx.fill();
  if(!p.long){ctx.fillStyle=p.bot; rr(-h*.07,hip-h*.02,h*.14,h*.08,h*.03); ctx.fill();}
  leg(sw*.6,p.bot); arm(sw*.7,p.top);
  ctx.fillStyle=p.skin; ctx.beginPath(); ctx.arc(Math.sin(sw*.7)*h*.15+h*.02,sh+h*.37,lw*.45,0,7); ctx.fill();
  if(p.bag){ctx.fillStyle='#2a2522';rr(Math.sin(sw*.7)*h*.15-h*.02,sh+h*.38,h*.08,h*.07,3);ctx.fill();}
  // neck + head + hair
  ctx.fillStyle=p.skin; ctx.fillRect(-h*.02,sh-h*.05,h*.04,h*.06);
  ctx.beginPath(); ctx.ellipse(h*.01,sh-h*.1,h*.055,h*.065,0,0,7); ctx.fill();
  ctx.fillStyle=p.hair; ctx.beginPath(); ctx.ellipse(-h*.005,sh-h*.13,h*.058,h*.045,0,Math.PI,2*Math.PI); ctx.fill();
  if(p.long){ctx.fillRect(-h*.06,sh-h*.13,h*.04,h*.16);}
  ctx.restore();
}

function fit(){const r=stage.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);cv.width=r.width*d;cv.height=r.height*d;}
addEventListener('resize',fit);

function camera(img,t,k,which){
  // which 0: A drifts right + pushes in; 1: B pulls back to full facade.
  const z=which===0?lerp(1.06,1.18,k):lerp(1.16,1.04,k);
  const ox=which===0?lerp(-20,40,k):lerp(-30,0,k);
  return {z,ox,oy:which===0?10:0};
}

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(playing) clock+=dt;
  const t=camT(); scrubEl.value=Math.round(t*1000);
  tag.textContent=t<.5?'المنظور الجانبي':'الواجهة الأمامية';
  const cw=cv.width,ch=cv.height; ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#000';ctx.fillRect(0,0,cw,ch);
  const cover=Math.max(cw/W,ch/H);
  const p=(clock%CYCLE)/CYCLE;
  const layer=(img,alpha,which,k,offset)=>{
    if(alpha<=0.001||!img.complete) return;
    const c=camera(img,t,k,which);
    const s=cover*c.z;
    // offset slides the outgoing/incoming plate sideways to read as an orbit
    ctx.setTransform(s,0,0,s,cw/2-(W/2)*s+(c.ox+pan.x)*s+offset*cw,ch/2-(H/2)*s+(c.oy+pan.y)*s);
    ctx.globalAlpha=alpha; ctx.drawImage(img,0,0,W,H);
    // wet-road reflections then actors, anchored to this plate's ground lines
    const v=VIEW[which];
    for(const c2 of cars) drawCar(c2,v[c2.lane]+2,v.cs*(c2.lane==='far'?1:1),true);
    for(const c2 of [...cars].sort((a,b)=>a.lane==='far'?-1:1)) drawCar(c2,v[c2.lane],v.cs,false);
    ctx.globalAlpha=alpha;
    for(const pp of people) drawPerson(pp,v.walk,v.ps,clock);
    ctx.globalAlpha=1;
  };
  const kA=manual!==null?.5:Math.min(1,p/.45), kB=manual!==null?.5:Math.min(1,Math.max(0,(p-.3)/.5));
  const orbit=Math.sin(t*Math.PI)*0;
  layer(A,1,0,kA,-t*.12);
  layer(B,t,1,kB,(1-t)*.12);
  // letterbox + vignette
  ctx.setTransform(1,0,0,1,0,0);
  const g=ctx.createRadialGradient(cw/2,ch/2,ch*.35,cw/2,ch/2,Math.max(cw,ch)*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.45)');
  ctx.fillStyle=g;ctx.fillRect(0,0,cw,ch);

  // advance actors
  if(playing){
    for(let i=0;i<cars.length;i++){const c=cars[i];c.x+=c.dir*c.v*dt; if(c.x<-c.len-50&&c.dir<0||c.x>W+c.len+50&&c.dir>0) cars[i]=newCar(false);}
    // keep spacing in each lane
    for(const a of cars)for(const b of cars){if(a!==b&&a.lane===b.lane&&Math.abs(a.x-b.x)<a.len*1.3){const back=a.dir<0?(a.x>b.x?a:b):(a.x<b.x?a:b);back.v=Math.max(80,back.v-60*dt);}}
    for(let i=0;i<people.length;i++){const q=people[i];q.x+=q.dir*q.v*dt; if(q.x>W+80&&q.dir>0||q.x<-80&&q.dir<0) people[i]=newPerson(false);}
  }
  requestAnimationFrame(frame);
}

const playEl=document.getElementById('play'),scrubEl=document.getElementById('scrub'),carsEl=document.getElementById('cars'),pplEl=document.getElementById('ppl'),tag=document.getElementById('tag');
playEl.textContent=playing?'إيقاف':'تشغيل';
playEl.onclick=()=>{playing=!playing;playEl.textContent=playing?'إيقاف':'تشغيل';if(playing)manual=null;};
document.getElementById('v1').onclick=()=>{manual=0;};
document.getElementById('v2').onclick=()=>{manual=1;};
scrubEl.oninput=()=>{manual=scrubEl.value/1000;};
carsEl.oninput=()=>sync(false); pplEl.oninput=()=>sync(false);
stage.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,px:pan.x,py:pan.y};stage.setPointerCapture(e.pointerId);});
stage.addEventListener('pointermove',e=>{if(!drag)return;pan.x=Math.max(-60,Math.min(60,drag.px+(e.clientX-drag.x)*.3));pan.y=Math.max(-25,Math.min(25,drag.py+(e.clientY-drag.y)*.2));});
stage.addEventListener('pointerup',()=>{drag=null;});
stage.addEventListener('dblclick',()=>{pan={x:0,y:0};});
sync(true); fit(); requestAnimationFrame(frame);
</script>
