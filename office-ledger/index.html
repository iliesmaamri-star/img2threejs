<title>دفتر حسابات الورشات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap">
<style>
/* Layout: a site ledger. Sticky header with tabs, one working column (max 1120px); cards only for summaries and sheets. */
:root{
  --bg:#ECEEEA; --surface:#FAFBF8; --sunk:#E1E4DF; --line:#C9CEC7; --fg:#1A201D; --muted:#5B655E;
  --accent:#24479A; --accent-ink:#FFFFFF; --accent-soft:#DDE4F4;
  --in:#1D7146; --in-soft:#DCEFE2; --out:#AB3327; --out-soft:#F5DFDA; --warn:#94600A; --warn-soft:#F5E9CF;
  --shadow:0 1px 2px rgba(20,32,26,.08),0 10px 28px rgba(20,32,26,.10);
  --scrim:rgba(18,24,21,.45);
  --f-display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131715; --surface:#1B201D; --sunk:#232925; --line:#343C37; --fg:#E6EBE7; --muted:#99A49C;
  --accent:#93B0F0; --accent-ink:#0E1830; --accent-soft:#223050;
  --in:#6CC693; --in-soft:#1A3326; --out:#EE8B7D; --out-soft:#3C221E; --warn:#E2B45C; --warn-soft:#382D17;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#131715; --surface:#1B201D; --sunk:#232925; --line:#343C37; --fg:#E6EBE7; --muted:#99A49C;
  --accent:#93B0F0; --accent-ink:#0E1830; --accent-soft:#223050;
  --in:#6CC693; --in-soft:#1A3326; --out:#EE8B7D; --out-soft:#3C221E; --warn:#E2B45C; --warn-soft:#382D17;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6); color-scheme:dark }

body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
#app{min-height:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.35}
.num{font-variant-numeric:tabular-nums;unicode-bidi:isolate;white-space:nowrap}
.cur{color:var(--muted);font-size:.85em}
.mono{font-family:var(--f-mono);font-size:.85em;unicode-bidi:isolate;white-space:nowrap}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:12px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand h1{font-size:1.15rem}
.brand .sub{font-size:.8rem;color:var(--muted)}
.mark{width:34px;height:34px;flex:none}
.brand-l{display:flex;align-items:center;gap:10px;min-width:0}
.who{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.who img{width:22px;height:22px;border-radius:50%}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab:hover{color:var(--fg)}

main{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 120px;display:flex;flex-direction:column;gap:22px}
section{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:1.02rem}
.label{font-size:.74rem;letter-spacing:.02em;color:var(--muted);font-weight:600}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.in{background:var(--in);border-color:var(--in);color:var(--surface)}
.btn.out{background:var(--out);border-color:var(--out);color:var(--surface)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.danger{color:var(--out);border-color:var(--out)}
.btn[disabled]{opacity:.55;cursor:wait}
.btn svg{width:16px;height:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-size:1.35rem;font-weight:700;font-family:var(--f-body)}
.kpi .v.in{color:var(--in)} .kpi .v.out{color:var(--out)}
.kpi .h{font-size:.78rem;color:var(--muted)}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* alerts */
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--fg);border-inline-start:4px solid var(--warn)}
.alert b{color:var(--warn)}
.alert.bad{background:var(--out-soft);border-inline-start-color:var(--out)}
.alert.bad b{color:var(--out)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.75rem;color:var(--muted);font-weight:600;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:end}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--sunk)}
.pos{color:var(--in)} .neg{color:var(--out)}

.pill{display:inline-block;font-size:.72rem;padding:1px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);font-weight:600;white-space:nowrap}
.pill.active{background:var(--accent-soft);color:var(--accent)}
.pill.done{background:var(--in-soft);color:var(--in)}
.pill.paused{background:var(--warn-soft);color:var(--warn)}
.pill.void{background:var(--out-soft);color:var(--out)}

/* operations list */
.ops{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.op{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:start;cursor:pointer;width:100%}
.op:last-child{border-bottom:0}
.op:hover{background:var(--sunk)}
.op .ic{grid-row:span 2;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:1.05rem}
.op .ic.in{background:var(--in-soft);color:var(--in)} .op .ic.out{background:var(--out-soft);color:var(--out)} .op .ic.transfer{background:var(--accent-soft);color:var(--accent)}
.op .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op .a{font-weight:700;text-align:end}
.op .a.in{color:var(--in)} .op .a.out{color:var(--out)} .op .a.transfer{color:var(--accent)}
.op .s{font-size:.8rem;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op .m{font-size:.78rem;color:var(--muted);text-align:end;display:flex;gap:8px;align-items:center;justify-content:flex-end}
.op .m svg{width:13px;height:13px}
.op.void .t,.op.void .a{text-decoration:line-through;opacity:.6}
.op .rb{font-size:.75rem;color:var(--muted)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0;text-align:start}
button.card{cursor:pointer} button.card:hover{border-color:var(--muted)}
.card h3{font-size:.98rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.88rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:end}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.bar .bi{background:var(--in)} .bar .bo{background:var(--out)}
.cat-bars{display:flex;flex-direction:column;gap:8px}
.cat-bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;font-size:.85rem}
.cat-bar .track{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.cat-bar .fill{height:100%;background:var(--out);border-radius:99px}

.hero{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.hero h2{font-size:1.35rem}
.back{align-self:flex-start}

/* onboarding */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;counter-reset:s}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.step .no{font-family:var(--f-display);font-size:1.6rem;color:var(--accent);line-height:1}
.step.ok{border-color:var(--in)} .step.ok .no{color:var(--in)}
@media (max-width:760px){.steps{grid-template-columns:1fr}}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

/* filters */
.filters{display:grid;grid-template-columns:2fr repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:860px){.filters{grid-template-columns:1fr 1fr}.filters .q{grid-column:1/-1}}

/* forms */
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld > span{font-size:.8rem;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=tel],input[type=date],input[type=month],input[type=datetime-local],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;min-height:42px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.f2{grid-template-columns:1fr}}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg label{display:block;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:9px 6px;font-weight:600;color:var(--muted);border-inline-start:1px solid var(--line)}
.seg label:first-child span{border-inline-start:0}
.seg input:checked + span.in{background:var(--in);color:var(--surface)}
.seg input:checked + span.out{background:var(--out);color:var(--surface)}
.seg input:checked + span.transfer{background:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:-3px}
.amt-in{font-size:1.4rem;font-weight:700;text-align:start}
.stamp{font-size:.8rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.err{color:var(--out);font-size:.85rem;min-height:1.2em}

/* receipts */
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--sunk);display:grid;place-items:center;cursor:pointer;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .pdf{font-family:var(--f-mono);font-weight:500;color:var(--out)}
.thumb .x{position:absolute;top:3px;inset-inline-end:3px;width:22px;height:22px;border-radius:50%;border:0;background:var(--scrim);color:#fff;cursor:pointer;line-height:1}
.drop{border:1px dashed var(--line);border-radius:9px;padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.drop input[type=file]{display:none}

/* modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;box-shadow:var(--shadow);padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:14px;max-height:88vh}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-h h2{font-size:1.1rem}
.x-btn{border:0;background:var(--sunk);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.1rem}
.sheet .foot{display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap;position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--surface);padding-block:10px;margin-bottom:-10px;border-top:1px solid var(--line)}
.lb{max-width:960px}
.lb img{width:100%;height:auto;border-radius:8px;background:var(--sunk)}
.lb iframe{width:100%;height:70vh;border:1px solid var(--line);border-radius:8px;background:#fff}
.hist{font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:10px}

.fab{position:fixed;inset-inline-end:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;border:0;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:14px 20px;box-shadow:var(--shadow);cursor:pointer;display:flex;gap:8px;align-items:center;font-size:1rem}
.fab svg{width:20px;height:20px}
.toast{position:fixed;inset-inline-start:50%;transform:translateX(50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:8px;box-shadow:var(--shadow);font-weight:500;max-width:calc(100% - 32px)}
.toast.bad{background:var(--out);color:var(--surface)}
.notice{background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:.9rem}
.skel{height:84px;border-radius:var(--r);background:linear-gradient(90deg,var(--sunk),var(--surface),var(--sunk));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.split{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.hold{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.hold div{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.hold div:last-child{border-bottom:0}
.hold .tot{background:var(--sunk);font-weight:700}
</style>

<div id="app" dir="rtl" lang="ar">
  <header class="top"><div class="top-in" id="hdr"></div></header>
  <main id="main">
    <section><div class="skel"></div><div class="skel"></div></section>
  </main>
  <button class="fab" id="fab" data-act="new-entry" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    عملية جديدة
  </button>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</div>

<script>
(function(){
"use strict";
document.documentElement.lang = "ar";

/* ---------- constants ---------- */
const OFFICE = "_office";
const CAT = {
  in: [["advance","دفعة مسبقة"],["installment","دفعة مرحلية"],["final","الدفعة النهائية"],["extra","أشغال إضافية"],["other_in","دخل آخر"]],
  out: [["materials","مواد البناء"],["labor","أجور العمال"],["subcontract","مقاول من الباطن"],["equipment","كراء معدات وآلات"],["transport","نقل وشحن"],["fuel","وقود"],["permits","وثائق ورخص"],["office","مصاريف المكتب"],["draw","سحب أرباح شريك"],["other_out","مصروف آخر"]],
};
const CAT_LABEL = Object.fromEntries([...CAT.in, ...CAT.out, ["transfer","تحويل بين الأعضاء"]]);
const METHODS = [["cash","نقدا"],["cheque","شيك"],["bank","تحويل بنكي"],["card","بطاقة"]];
const METHOD_LABEL = Object.fromEntries(METHODS);
const KIND = {partner:"شريك", member:"عضو", account:"صندوق / حساب بنكي"};
const STATUS = {active:"قيد الإنجاز", done:"منتهي", paused:"متوقف"};
const TYPE_LABEL = {in:"دخل", out:"مصروف", transfer:"تحويل"};
const TABS = [["home","الرئيسية"],["clients","الزبائن والمشاريع"],["ops","سجل العمليات"],["people","الشركاء والأعضاء"]];
const ICON_CLIP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.5l-8.5 8.5a5 5 0 01-7-7L14 5.5a3.4 3.4 0 014.8 4.8l-8.4 8.4a1.7 1.7 0 01-2.4-2.4L15.5 8.8"/></svg>';

/* ---------- state ---------- */
const S = {
  ready:false, noDb:false, db:null, user:null, assets:null,
  clients:[], entries:[], members:[], settings:{},
  loaded:{clients:false, entries:false, members:false},
  me:null, meProfile:null, readOnly:false, prof:{}, profAsked:new Set(),
  tab:"home", clientId:null, cq:"",
  f:{q:"", type:"", client:"", member:"", month:""},
};
try{ const t = localStorage.getItem("ledger.tab"); if (t && TABS.some(x=>x[0]===t)) S.tab = t; }catch(_){}

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = new Intl.NumberFormat("fr-FR", {minimumFractionDigits:2, maximumFractionDigits:2});
const cur = () => S.settings.currency || "دج";
function money(n, sign){
  const v = Number(n)||0;
  let s = nf.format(Math.abs(v));
  if (sign === "in") s = "+" + s; else if (sign === "out") s = "−" + s; else if (v < 0) s = "−" + s;
  return `<span class="num" dir="ltr">${s}</span> <span class="cur">${esc(cur())}</span>`;
}
const pad = n => String(n).padStart(2,"0");
function fmtDT(iso){ if(!iso) return ""; const d = new Date(iso); if (isNaN(d)) return ""; return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtD(iso){ if(!iso) return ""; const d = new Date(iso); if (isNaN(d)) return ""; return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`; }
function toLocalInput(iso){ const d = iso ? new Date(iso) : new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
const dt = iso => `<span class="mono" dir="ltr">${esc(fmtDT(iso))}</span>`;
function parseAmount(s){ const t = String(s||"").replace(/[\s  ]/g,"").replace(",","."); const n = Number(t); return isFinite(n) ? Math.round(n*100)/100 : NaN; }
const byId = (list, id) => list.find(x => x.id === id);
const clientName = id => id === OFFICE ? "عام للمكتب" : (byId(S.clients,id)?.name || "زبون محذوف");
const memberName = id => id ? (byId(S.members,id)?.name || "عضو محذوف") : "غير محدد";
const personName = uid => (uid && S.prof[uid] && S.prof[uid].name) || "أحد الأعضاء";
const myMember = () => S.me ? S.members.find(m => m.userId === S.me) : null;
const active = () => S.entries.filter(e => !e.void);

function totals(list){ let i=0,o=0; for (const e of list){ if (e.void) continue; if (e.type==="in") i+=e.amount; else if (e.type==="out") o+=e.amount; } return {i, o, b:i-o}; }
const clientTotals = cid => totals(S.entries.filter(e => e.clientId === cid));
function holdings(){
  const h = {};
  const add = (k,v) => { h[k||""] = (h[k||""]||0) + v; };
  for (const e of active()){
    if (e.type==="in") add(e.memberId, e.amount);
    else if (e.type==="out") add(e.memberId, -e.amount);
    else if (e.type==="transfer"){ add(e.fromId, -e.amount); add(e.toId, e.amount); }
  }
  return h;
}
function sortEntries(list){ return list.slice().sort((a,b) => (b.at||"").localeCompare(a.at||"") || (b.createdAt||"").localeCompare(a.createdAt||"")); }

let toastT;
function toast(msg, bad){ const t = $("#toast"); t.textContent = msg; t.className = "toast" + (bad?" bad":""); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=>{ t.hidden = true; }, bad?5000:2600); }
function errMsg(e){
  const c = e && e.code;
  if (c === "quota_exceeded") return "امتلأت مساحة التخزين. احذفوا عمليات أو ملفات قديمة ثم أعيدوا المحاولة.";
  if (c === "invalid_argument") return "لا تملك صلاحية التعديل على هذا الدفتر. اطلب من صاحب الدفتر صلاحية المساهمة.";
  if (c === "too_large") return "الملف أكبر من 20 ميغابايت. صوّروا الفاتورة بدقة أقل.";
  if (c === "unsupported_type") return "نوع الملف غير مقبول. استعملوا صورة JPG أو PNG أو ملف PDF.";
  if (c === "rate_limited" || c === "resource_exhausted") return "طلبات كثيرة في وقت قصير. انتظروا قليلا ثم أعيدوا المحاولة.";
  if (c === "not_granted" || c === "revoked") return "لم يعد لديك وصول للحفظ في هذا الدفتر.";
  return "تعذّر الحفظ. تحقّقوا من الاتصال ثم أعيدوا المحاولة.";
}
async function write(fn){
  try { await fn(); return true; }
  catch(e){
    if (e && e.code === "unavailable"){ await new Promise(r=>setTimeout(r, 600+Math.random()*600)); try { await fn(); return true; } catch(e2){ toast(errMsg(e2), true); return false; } }
    toast(errMsg(e), true); return false;
  }
}

/* ---------- rendering ---------- */
let raf = 0;
function render(){ if (raf) return; raf = requestAnimationFrame(()=>{ raf = 0; draw(); }); }
function draw(){
  const a = document.activeElement, aid = a && a.id && $("#main").contains(a) ? a.id : null;
  let ss=null, se=null; try { if (aid){ ss = a.selectionStart; se = a.selectionEnd; } } catch(_){}
  $("#hdr").innerHTML = header();
  $("#main").innerHTML = view();
  $("#fab").hidden = !(S.ready && S.db && !S.readOnly);
  if (aid){ const el = document.getElementById(aid); if (el){ el.focus(); try { if (ss!=null) el.setSelectionRange(ss, se); } catch(_){} } }
  resolveProfiles();
}

function header(){
  const co = S.settings.company || "دفتر حسابات الورشات";
  const mm = myMember();
  const who = S.meProfile ? `<span class="who"><img src="${esc(S.meProfile.avatarUrl)}" alt=""><span>${esc(S.meProfile.name || "أنت")}${mm ? " · " + esc(mm.name) : ""}${S.readOnly ? " · اطّلاع فقط" : ""}</span></span>` : "";
  return `<div class="brand">
    <div class="brand-l">
      <svg class="mark" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="7" fill="var(--accent)"/><path d="M8 25V14l9-6 9 6v11" fill="none" stroke="var(--accent-ink)" stroke-width="2.2" stroke-linejoin="round"/><path d="M13 25v-6h8v6M8 25h18" fill="none" stroke="var(--accent-ink)" stroke-width="2.2" stroke-linecap="round"/></svg>
      <div><h1>${esc(co)}</h1><div class="sub">متابعة مداخيل ومصاريف كل زبون ومشروع</div></div>
    </div>${who}</div>
    <nav class="tabs" aria-label="الأقسام">${TABS.map(([k,l]) => `<button class="tab" data-act="tab" data-tab="${k}" ${S.tab===k?'aria-current="page"':""}>${l}</button>`).join("")}</nav>`;
}

function view(){
  if (S.noDb) return `<section><div class="empty"><h2>الدفتر غير متصل بالتخزين</h2><p>افتحوا هذه الصفحة من حسابكم على claude.ai مع تسجيل الدخول، حتى تُحفظ العمليات وتظهر لكل أعضاء المكتب.</p></div></section>`;
  if (!S.ready) return `<section><div class="skel"></div><div class="skel"></div><p class="muted">جارٍ تحميل الدفتر…</p></section>`;
  if (S.tab === "clients") return S.clientId ? clientView(S.clientId) : clientsView();
  if (S.tab === "ops") return opsView();
  if (S.tab === "people") return peopleView();
  return homeView();
}

function opRow(e, extra){
  const t = e.type;
  const ic = t==="in" ? "+" : t==="out" ? "−" : "⇄";
  let title, sub;
  if (t === "transfer"){ title = `تحويل: ${esc(memberName(e.fromId))} ← ${esc(memberName(e.toId))}`; sub = esc(e.note || METHOD_LABEL[e.method] || ""); }
  else {
    title = `${esc(CAT_LABEL[e.category] || TYPE_LABEL[t])} · ${esc(clientName(e.clientId))}`;
    const bits = [];
    if (e.category === "draw" && e.beneficiaryId) bits.push("لفائدة " + esc(memberName(e.beneficiaryId)));
    if (e.supplier) bits.push(esc(e.supplier));
    if (e.note) bits.push(esc(e.note));
    bits.push((t==="in" ? "استلمها: " : "دفعها: ") + esc(memberName(e.memberId)));
    sub = bits.join(" · ");
  }
  const n = (e.receipts||[]).length;
  return `<button class="op ${e.void?"void":""}" data-act="entry" data-id="${esc(e.id)}">
    <span class="ic ${t}" aria-hidden="true">${ic}</span>
    <span class="t">${title}${e.void ? ' <span class="pill void">ملغاة</span>' : ""}</span>
    <span class="a ${t}">${money(e.amount, t==="transfer"?null:t)}</span>
    <span class="s">${sub}</span>
    <span class="m">${n ? `<span title="فواتير مرفقة">${ICON_CLIP}${n}</span>` : ""}${dt(e.at)}</span>
    ${extra||""}
  </button>`;
}

function homeView(){
  const noSetup = !S.members.length && !S.clients.length && !S.entries.length;
  const tt = totals(S.entries);
  let remaining = 0;
  for (const c of S.clients){ if (c.status === "paused") continue; const r = (c.contract||0) - clientTotals(c.id).i; if (r > 0) remaining += r; }
  const alerts = S.clients.map(c => ({c, t:clientTotals(c.id)})).filter(x => x.t.b < 0 && x.c.status !== "done");
  const recent = sortEntries(S.entries).slice(0, 8);
  const h = holdings();
  let html = "";
  if (noSetup || !S.members.length || !S.clients.length || !S.entries.length){
    const s1 = S.members.length>0, s2 = S.clients.length>0, s3 = S.entries.length>0;
    html += `<section><div class="sec-h"><h2>ابدأوا الدفتر في ثلاث خطوات</h2></div><div class="steps">
      <div class="step ${s1?"ok":""}"><span class="no">1</span><b>أضيفوا الشريكين والأعضاء</b><span class="muted">وأضيفوا الصندوق أو الحساب البنكي إن وجد، حتى نعرف عند من توجد الأموال.</span>${S.readOnly?"":`<button class="btn ${s1?"":"pri"}" data-act="new-member">${s1?"إضافة عضو آخر":"إضافة شريك أو عضو"}</button>`}</div>
      <div class="step ${s2?"ok":""}"><span class="no">2</span><b>أضيفوا الزبون الأول</b><span class="muted">اسم الزبون، المشروع، وقيمة العقد الإجمالية لمتابعة الدفعات المتبقية.</span>${S.readOnly?"":`<button class="btn ${!s2&&s1?"pri":""}" data-act="new-client">إضافة زبون</button>`}</div>
      <div class="step ${s3?"ok":""}"><span class="no">3</span><b>سجّلوا أول عملية</b><span class="muted">دفعة من الزبون أو مصروف للمشروع، مع صورة الفاتورة. التاريخ والساعة يُسجّلان تلقائيا.</span>${S.readOnly?"":`<button class="btn ${!s3&&s2?"pri":""}" data-act="new-entry">تسجيل عملية</button>`}</div>
    </div></section>`;
  }
  html += `<section><div class="kpis">
    <div class="kpi"><span class="label">إجمالي المداخيل</span><span class="v in">${money(tt.i)}</span><span class="h">كل الدفعات المقبوضة</span></div>
    <div class="kpi"><span class="label">إجمالي المصاريف</span><span class="v out">${money(tt.o)}</span><span class="h">مشاريع ومكتب وسحوبات</span></div>
    <div class="kpi"><span class="label">الرصيد المتوفر</span><span class="v ${tt.b<0?"out":""}">${money(tt.b)}</span><span class="h">المداخيل ناقص المصاريف</span></div>
    <div class="kpi"><span class="label">متبقٍّ للتحصيل</span><span class="v">${money(remaining)}</span><span class="h">من قيم العقود</span></div>
  </div></section>`;
  if (alerts.length){
    html += `<section>${alerts.map(x => `<div class="alert bad"><div><b>${esc(x.c.name)}</b>: المصاريف تجاوزت ما دفعه الزبون بـ ${money(-x.t.b)}. المكتب يموّل هذا المشروع من أمواله حاليا.</div></div>`).join("")}</section>`;
  }
  html += `<div class="split"><section><div class="sec-h"><h2>آخر العمليات</h2>${S.entries.length?`<button class="btn ghost" data-act="tab" data-tab="ops">كل السجل</button>`:""}</div>
    ${recent.length ? `<div class="ops">${recent.map(e=>opRow(e)).join("")}</div>` : `<div class="empty">لا توجد عمليات بعد. كل دفعة أو مصروف تسجّلونه يظهر هنا مع تاريخه وساعته.</div>`}</section>
    <section><div class="sec-h"><h2>أين توجد الأموال</h2></div>${holdingsHtml(h)}</section></div>`;
  if (S.clients.length) html += `<section><div class="sec-h"><h2>حالة الزبائن</h2><button class="btn ghost" data-act="tab" data-tab="clients">كل الزبائن</button></div>${clientsTable(S.clients.filter(c=>c.status!=="done"))}</section>`;
  return html;
}

function holdingsHtml(h){
  const keys = Object.keys(h).filter(k => Math.abs(h[k]) > 0.004);
  if (!keys.length) return `<div class="empty">عند تسجيل من استلم كل دفعة ومن دفع كل مصروف، يظهر هنا رصيد كل شخص أو صندوق.</div>`;
  keys.sort((a,b) => h[b]-h[a]);
  let sum = 0; keys.forEach(k => sum += h[k]);
  return `<div class="hold">${keys.map(k => `<div><span>${esc(memberName(k))}${k&&byId(S.members,k)?` <span class="pill">${esc(KIND[byId(S.members,k).kind]||"")}</span>`:""}</span><b class="${h[k]<0?"neg":""}">${money(h[k])}</b></div>`).join("")}<div class="tot"><span>المجموع</span><span>${money(sum)}</span></div></div>
  <p class="muted" style="margin:0;font-size:.8rem">رصيد سالب يعني أن الشخص دفع من ماله الخاص أكثر مما استلم، فالمكتب مدين له.</p>`;
}

function clientsTable(list){
  if (!list.length) return `<div class="empty">لا يوجد زبائن بمشاريع جارية.</div>`;
  return `<div class="tw"><table><thead><tr><th>الزبون</th><th>المشروع</th><th class="n">قيمة العقد</th><th class="n">المقبوض</th><th class="n">المصروف</th><th class="n">الرصيد</th><th class="n">المتبقي</th><th>الحالة</th></tr></thead><tbody>
  ${list.map(c => { const t = clientTotals(c.id); const rem = (c.contract||0) - t.i; return `<tr class="click" data-act="client" data-id="${esc(c.id)}" tabindex="0">
    <td><b>${esc(c.name)}</b></td><td class="muted">${esc(c.project||"")}</td>
    <td class="n">${c.contract?money(c.contract):"—"}</td><td class="n pos">${money(t.i)}</td><td class="n neg">${money(t.o)}</td>
    <td class="n ${t.b<0?"neg":""}"><b>${money(t.b)}</b></td><td class="n">${c.contract?money(Math.max(rem,0)):"—"}</td>
    <td><span class="pill ${esc(c.status||"active")}">${esc(STATUS[c.status||"active"])}</span></td></tr>`; }).join("")}
  </tbody></table></div>`;
}

function clientsView(){
  const q = S.cq.trim().toLowerCase();
  const list = S.clients.filter(c => !q || [c.name,c.project,c.location,c.phone].join(" ").toLowerCase().includes(q))
    .sort((a,b) => (a.status==="done") - (b.status==="done") || (b.createdAt||"").localeCompare(a.createdAt||""));
  const off = clientTotals(OFFICE);
  return `<section><div class="sec-h"><h2>الزبائن والمشاريع</h2>${S.readOnly?"":`<button class="btn pri" data-act="new-client">إضافة زبون</button>`}</div>
    <input type="search" id="cq" placeholder="ابحث بالاسم أو المشروع أو الهاتف" value="${esc(S.cq)}" aria-label="بحث في الزبائن">
    ${list.length ? `<div class="grid">${list.map(clientCard).join("")}</div>` : `<div class="empty">${S.clients.length?"لا يوجد زبون بهذا البحث.":"أضيفوا أول زبون مع قيمة العقد لتبدأ متابعة دفعاته ومصاريف مشروعه."}</div>`}
  </section>
  <section><div class="sec-h"><h2>عام للمكتب</h2></div>
    <button class="card" data-act="client" data-id="${OFFICE}"><h3>مداخيل ومصاريف عامة غير مرتبطة بزبون</h3>
    <dl class="kv"><dt>المداخيل</dt><dd class="pos">${money(off.i)}</dd><dt>المصاريف</dt><dd class="neg">${money(off.o)}</dd></dl></button></section>`;
}

function clientCard(c){
  const t = clientTotals(c.id);
  const base = Math.max(c.contract||0, t.i, t.o, 1);
  return `<button class="card" data-act="client" data-id="${esc(c.id)}">
    <div class="sec-h"><h3>${esc(c.name)}</h3><span class="pill ${esc(c.status||"active")}">${esc(STATUS[c.status||"active"])}</span></div>
    ${c.project?`<span class="muted" style="font-size:.85rem">${esc(c.project)}${c.location?" · "+esc(c.location):""}</span>`:""}
    <dl class="kv">
      ${c.contract?`<dt>قيمة العقد</dt><dd>${money(c.contract)}</dd>`:""}
      <dt>المقبوض</dt><dd class="pos">${money(t.i)}</dd>
      <dt>المصروف</dt><dd class="neg">${money(t.o)}</dd>
      <dt>الرصيد</dt><dd class="${t.b<0?"neg":""}"><b>${money(t.b)}</b></dd>
    </dl>
    <div class="bar" title="المقبوض مقابل المصروف"><span class="bi" style="width:${(t.i/base*100).toFixed(1)}%"></span></div>
    <div class="bar"><span class="bo" style="width:${(t.o/base*100).toFixed(1)}%"></span></div>
  </button>`;
}

function clientView(id){
  const isOff = id === OFFICE;
  const c = isOff ? {id, name:"عام للمكتب", project:"مداخيل ومصاريف غير مرتبطة بزبون"} : byId(S.clients, id);
  if (!c) return `<section><button class="btn back" data-act="back">رجوع للزبائن</button><div class="empty">هذا الزبون غير موجود.</div></section>`;
  const list = S.entries.filter(e => e.clientId === id);
  const t = totals(list);
  // running balance (chronological)
  const asc = list.slice().sort((a,b) => (a.at||"").localeCompare(b.at||"") || (a.createdAt||"").localeCompare(b.createdAt||""));
  const rb = {}; let run = 0;
  for (const e of asc){ if (!e.void){ run += e.type==="in" ? e.amount : -e.amount; } rb[e.id] = run; }
  const cats = {};
  for (const e of list){ if (!e.void && e.type==="out") cats[e.category] = (cats[e.category]||0) + e.amount; }
  const ck = Object.keys(cats).sort((a,b)=>cats[b]-cats[a]); const cmax = Math.max(1, ...ck.map(k=>cats[k]));
  const rem = (c.contract||0) - t.i;
  const pct = c.contract ? Math.min(100, t.i / c.contract * 100) : 0;
  return `<section><button class="btn back" data-act="back">رجوع للزبائن</button>
    <div class="hero"><div><h2>${esc(c.name)}</h2><div class="muted">${esc(c.project||"")}${c.location?" · "+esc(c.location):""}${c.phone?` · <span dir="ltr" class="mono">${esc(c.phone)}</span>`:""}</div>
      ${!isOff?`<div class="row" style="margin-top:6px"><span class="pill ${esc(c.status||"active")}">${esc(STATUS[c.status||"active"])}</span>${c.startDate?`<span class="muted" style="font-size:.82rem">بداية الأشغال ${esc(fmtD(c.startDate))}</span>`:""}</div>`:""}</div>
      ${S.readOnly?"":`<div class="row"><button class="btn in" data-act="new-entry" data-type="in" data-client="${esc(id)}">${isOff?"دخل":"دفعة من الزبون"}</button><button class="btn out" data-act="new-entry" data-type="out" data-client="${esc(id)}">مصروف</button>${isOff?"":`<button class="btn" data-act="edit-client" data-id="${esc(id)}">تعديل</button>`}</div>`}
    </div>
    ${c.notes?`<div class="notice">${esc(c.notes)}</div>`:""}
    <div class="kpis">
      <div class="kpi"><span class="label">${isOff?"المداخيل":"دفعات الزبون"}</span><span class="v in">${money(t.i)}</span><span class="h">${list.filter(e=>e.type==="in"&&!e.void).length} عملية</span></div>
      <div class="kpi"><span class="label">المصاريف</span><span class="v out">${money(t.o)}</span><span class="h">${list.filter(e=>e.type==="out"&&!e.void).length} عملية</span></div>
      <div class="kpi"><span class="label">الرصيد</span><span class="v ${t.b<0?"out":""}">${money(t.b)}</span><span class="h">${t.b<0?"المكتب يموّل الفرق":"متاح لهذا المشروع"}</span></div>
      ${isOff?`<div class="kpi"><span class="label">الفواتير المرفقة</span><span class="v">${list.reduce((s,e)=>s+(e.receipts||[]).length,0)}</span><span class="h">صورة أو ملف</span></div>`
      :`<div class="kpi"><span class="label">متبقٍّ على الزبون</span><span class="v">${c.contract?money(Math.max(rem,0)):"—"}</span><span class="h">${c.contract?`دفع ${pct.toFixed(0)}% من ${nf.format(c.contract)}`:"لم تُحدَّد قيمة العقد"}</span></div>`}
    </div>
    ${c.contract?`<div class="bar" role="img" aria-label="نسبة ما دفعه الزبون"><span class="bi" style="width:${pct.toFixed(1)}%"></span></div>`:""}
  </section>
  ${ck.length?`<section><div class="sec-h"><h2>المصاريف حسب الصنف</h2></div><div class="cat-bars">${ck.map(k=>`<div class="cat-bar"><span>${esc(CAT_LABEL[k]||k)}</span><span class="track"><span class="fill" style="width:${(cats[k]/cmax*100).toFixed(1)}%;display:block"></span></span><b>${money(cats[k])}</b></div>`).join("")}</div></section>`:""}
  <section><div class="sec-h"><h2>كشف الحساب</h2><span class="muted" style="font-size:.82rem">الرصيد بعد كل عملية</span></div>
    ${list.length?`<div class="ops">${sortEntries(list).map(e=>opRow(e, `<span class="rb" style="grid-column:2/-1">الرصيد بعدها: ${money(rb[e.id])}</span>`)).join("")}</div>`:`<div class="empty">لا توجد عمليات لهذا ${isOff?"القسم":"الزبون"} بعد.</div>`}
  </section>
  ${!isOff && !S.readOnly && !list.length ? `<section><button class="btn danger" data-act="del-client" data-id="${esc(id)}" style="align-self:flex-start">حذف الزبون</button></section>`:""}`;
}

function filtered(){
  const f = S.f, q = f.q.trim().toLowerCase();
  return sortEntries(S.entries.filter(e => {
    if (f.type && e.type !== f.type) return false;
    if (f.client && e.clientId !== f.client) return false;
    if (f.member && e.memberId !== f.member && e.fromId !== f.member && e.toId !== f.member && e.beneficiaryId !== f.member) return false;
    if (f.month){ const d = new Date(e.at); if (`${d.getFullYear()}-${pad(d.getMonth()+1)}` !== f.month) return false; }
    if (q){ const hay = [e.note,e.supplier,e.ref,CAT_LABEL[e.category],clientName(e.clientId),memberName(e.memberId),String(e.amount)].join(" ").toLowerCase(); if (!hay.includes(q)) return false; }
    return true;
  }));
}
function opsView(){
  const list = filtered(); const t = totals(list);
  const opt = (arr, sel) => arr.map(([v,l]) => `<option value="${esc(v)}" ${sel===v?"selected":""}>${esc(l)}</option>`).join("");
  return `<section><div class="sec-h"><h2>سجل العمليات</h2><div class="row"><button class="btn" data-act="export" ${S.entries.length?"":"disabled"}>تصدير CSV</button></div></div>
    <div class="filters">
      <input class="q" type="search" id="fq" placeholder="بحث: مورد، ملاحظة، رقم فاتورة، مبلغ" value="${esc(S.f.q)}" aria-label="بحث">
      <select id="ft" aria-label="النوع"><option value="">كل الأنواع</option>${opt([["in","دخل"],["out","مصروف"],["transfer","تحويل"]], S.f.type)}</select>

function profitCalc(){
  const done = S.clients.filter(c => c.status === "done");
  let realized = 0; for (const c of done) realized += clientTotals(c.id).b;
  let officeIn = 0, overhead = 0; const draws = {};
  for (const e of active()){
    if (e.clientId !== OFFICE) continue;
    if (e.type === "in") officeIn += e.amount;
    else if (e.type === "out"){ if (e.category === "draw") draws[e.beneficiaryId||""] = (draws[e.beneficiaryId||""]||0) + e.amount; else overhead += e.amount; }
  }
  let ongoing = 0; for (const c of S.clients) if (c.status !== "done") ongoing += clientTotals(c.id).b;
  return {done: done.length, realized, officeIn, overhead, dist: realized + officeIn - overhead, draws, ongoing};
}

async function resolveProfiles(){
  if (!S.user) return;
  const ids = new Set();
  for (const e of S.entries){ if (e.createdBy) ids.add(e.createdBy); if (e.voidBy) ids.add(e.voidBy); for (const h of e.history||[]) if (h.by) ids.add(h.by); }
  for (const m of S.members) if (m.userId) ids.add(m.userId);
  const need = [...ids].filter(id => !S.profAsked.has(id));
  if (!need.length) return;
  need.forEach(id => S.profAsked.add(id));
  try { const ps = await S.user.profiles(need); Object.assign(S.prof, ps); render(); } catch(_){}
}

/* ---------- receipts ---------- */
async function prepFile(f){
  const type = (f.type||"").toLowerCase();
  if (type === "application/pdf" || /\.pdf$/i.test(f.name)) return {blob:f, type:"application/pdf"};
  if (!/^image\//.test(type)) throw {code:"unsupported_type"};
  if (type === "image/gif" || type === "image/svg+xml") return {blob:f, type};
  try {
    const bmp = await createImageBitmap(f);
    const k = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, "image/jpeg", 0.82));
    if (b && (b.size < f.size || !/^image\/(jpeg|png|webp)$/.test(type))) return {blob:b, type:"image/jpeg"};
  } catch(_){}
  if (!/^image\/(jpeg|png|webp)$/.test(type)) throw {code:"unsupported_type"};
  return {blob:f, type};
}
async function uploadFiles(files, onStep){
  const out = [];
  for (let i=0;i<files.length;i++){
    onStep && onStep(i+1, files.length);
    const p = await prepFile(files[i]);
    const r = await S.assets.upload(p.blob, {type:p.type});
    out.push({id:r.id, type:r.contentType, name:files[i].name||"", size:r.sizeBytes, at:new Date().toISOString(), by:S.me||null});
  }
  return out;
}

}

    rows.push(["الصنف", esc(CAT_LABEL[e.category]||"")]);
    if (e.beneficiaryId) rows.push(["لفائدة الشريك", esc(memberName(e.beneficiaryId))]);
    rows.push([e.type==="in"?"استلمها":"دفعها", esc(memberName(e.memberId))]);
    if (e.supplier) rows.push(["المورد", esc(e.supplier)]);
  }
  rows.push(["طريقة الدفع", esc(METHOD_LABEL[e.method]||"")]);
  if (e.ref) rows.push(["رقم الفاتورة / الشيك", `<span dir="auto">${esc(e.ref)}</span>`]);
  rows.push(["تاريخ العملية", dt(e.at)]);
  rows.push(["سُجّلت في", `${dt(e.createdAt)} · ${esc(personName(e.createdBy))}`]);
  if (e.updatedAt) rows.push(["آخر تعديل", `${dt(e.updatedAt)} · ${esc(personName(e.updatedBy))}`]);
  const hist = (e.history||[]).map(h => {
    const ch = Object.keys(h.prev||{}).map(k => { const old = h.prev[k]; const lbl = {amount:"المبلغ",at:"التاريخ",clientId:"الزبون",category:"الصنف",memberId:"العضو",note:"الملاحظة",type:"النوع",supplier:"المورد",ref:"المرجع",method:"طريقة الدفع",fromId:"من",toId:"إلى",beneficiaryId:"الشريك"}[k]||k;
      const ov = k==="amount" ? nf.format(old||0) : k==="at" ? fmtDT(old) : k==="clientId" ? clientName(old) : /Id$/.test(k) ? memberName(old) : k==="category" ? (CAT_LABEL[old]||old) : k==="type" ? TYPE_LABEL[old] : k==="method" ? METHOD_LABEL[old] : old;
      return `${lbl} كان «${esc(ov||"فارغ")}»`; });
    if (h.added) ch.push(`أُضيفت ${h.added} فاتورة`);
    if (h.action === "void") ch.push(`أُلغيت: ${esc(h.reason||"")}`);
    if (h.action === "restore") ch.push("أُعيد تفعيلها");
    return `<div>${dt(h.at)} · ${esc(personName(h.by))}: ${ch.join("، ") || "تعديل"}</div>`;
  }).join("");
  const sh = openModal(`${sheetHead(`${esc(TYPE_LABEL[e.type])} ${e.void?'<span class="pill void">ملغاة</span>':""}`)}
    <div class="${e.type==="in"?"pos":e.type==="out"?"neg":""}" style="font-size:1.7rem;font-weight:700">${money(e.amount, e.type==="transfer"?null:e.type)}</div>
    ${e.void?`<div class="alert bad"><div><b>ملغاة</b> في ${dt(e.voidAt)} من طرف ${esc(personName(e.voidBy))}. السبب: ${esc(e.voidReason||"")}<br>لا تُحسب في المجاميع.</div></div>`:""}
    <dl class="kv">${rows.map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
    ${e.note?`<div class="notice">${esc(e.note)}</div>`:""}
    <div class="fld"><span>الفواتير المرفقة (${(e.receipts||[]).length})</span>
      ${(e.receipts||[]).length?`<div class="thumbs">${e.receipts.map(r=>thumbHtml(r,e.id)).join("")}</div>`:`<span class="muted" style="font-size:.88rem">لا توجد فاتورة مرفقة.</span>`}
      ${S.assets && !S.readOnly ? `<div class="row"><label class="btn"><input type="file" accept="image/*" capture="environment" data-attach="${esc(e.id)}" hidden>تصوير فاتورة</label><label class="btn"><input type="file" accept="image/*,application/pdf" multiple data-attach="${esc(e.id)}" hidden>إرفاق ملف</label><span class="muted" id="att-st" style="font-size:.85rem"></span></div>`:""}
    </div>
    ${hist?`<div class="hist"><b>سجل التغييرات</b>${hist}</div>`:""}
    <div id="void-box"></div>
    ${S.readOnly?"":`<div class="foot">${e.void?`<button class="btn" data-act="restore" data-id="${esc(e.id)}">إعادة تفعيل العملية</button>`:`<button class="btn pri" data-act="edit-entry" data-id="${esc(e.id)}">تعديل</button><button class="btn danger" data-act="void" data-id="${esc(e.id)}">إلغاء العملية</button>`}</div>`}`);
  sh.addEventListener("change", async ev => {
    const eid = ev.target.dataset.attach; if (!eid) return;
    const files = [...ev.target.files]; ev.target.value = ""; if (!files.length) return;
    const st = $("#att-st", sh);
    try {
      const up = await uploadFiles(files, (i,n) => { st.textContent = `جارٍ رفع ${i} من ${n}…`; });
      const cur = byId(S.entries, eid); const now = new Date().toISOString();
      const ok = await write(() => S.db.doc("entries/"+eid).update({receipts:(cur.receipts||[]).concat(up), history:(cur.history||[]).concat([{at:now, by:S.me||null, prev:{}, added:up.length}])}));
      if (ok){ toast("أُرفقت الفاتورة"); entryDetail(eid); }
    } catch(x){ st.textContent = errMsg(x); }
  });
}
function voidBox(id){
  const box = $("#void-box"); if (!box) return;
  box.innerHTML = `<div class="card" style="border-color:var(--out)"><label class="fld"><span>سبب الإلغاء (يبقى ظاهرا في السجل)</span><input type="text" id="void-r" placeholder="مثال: مسجّلة مرتين"></label><div class="err" id="void-err"></div><div class="row"><button class="btn out" data-act="void-ok" data-id="${esc(id)}">تأكيد الإلغاء</button><button class="btn" data-act="void-no">تراجع</button></div></div>`;
  $("#void-r").focus();
}

/* ---------- client form ---------- */
function clientForm(id){
  const c = id ? byId(S.clients, id) : null;
  const v = c || {name:"", phone:"", project:"", location:"", contract:"", startDate:"", status:"active", notes:""};
  const sh = openModal(`${sheetHead(c?"تعديل الزبون":"زبون جديد")}
    <form id="cf" novalidate style="display:flex;flex-direction:column;gap:12px">
      <label class="fld"><span>اسم الزبون</span><input type="text" id="cf-name" value="${esc(v.name)}" autofocus></label>
      <div class="f2"><label class="fld"><span>الهاتف</span><input type="tel" id="cf-phone" dir="ltr" value="${esc(v.phone||"")}"></label>
      <label class="fld"><span>الموقع / العنوان</span><input type="text" id="cf-loc" value="${esc(v.location||"")}"></label></div>
      <label class="fld"><span>المشروع</span><input type="text" id="cf-proj" value="${esc(v.project||"")}" placeholder="مثال: بناء فيلا R+2"></label>
      <div class="f2"><label class="fld"><span>قيمة العقد الإجمالية (${esc(cur())})</span><input type="text" inputmode="decimal" dir="ltr" id="cf-contract" value="${v.contract?esc(String(v.contract)):""}" placeholder="0,00"></label>
      <label class="fld"><span>تاريخ بداية الأشغال</span><input type="date" id="cf-start" value="${esc(v.startDate||"")}"></label></div>
      <label class="fld"><span>حالة المشروع</span><select id="cf-status">${Object.entries(STATUS).map(([k,l])=>`<option value="${k}" ${v.status===k?"selected":""}>${l}</option>`).join("")}</select></label>
      <label class="fld"><span>ملاحظات (شروط الدفع، مراحل الأشغال…)</span><textarea id="cf-notes">${esc(v.notes||"")}</textarea></label>
      <div class="err" id="cf-err" role="alert"></div>
      <div class="foot"><button class="btn pri" type="submit">${c?"حفظ":"إضافة الزبون"}</button><button class="btn" type="button" data-act="close">إلغاء</button></div>
    </form>`);
  $("#cf", sh).addEventListener("submit", async ev => {
    ev.preventDefault();
    const name = $("#cf-name", sh).value.trim();
    const cv = $("#cf-contract", sh).value.trim(); const contract = cv ? parseAmount(cv) : 0;
    if (!name) { $("#cf-err", sh).textContent = "اكتبوا اسم الزبون."; return; }
    if (isNaN(contract) || contract < 0) { $("#cf-err", sh).textContent = "قيمة العقد غير صحيحة."; return; }
    const now = new Date().toISOString();
    const body = {name, phone:$("#cf-phone", sh).value.trim(), location:$("#cf-loc", sh).value.trim(), project:$("#cf-proj", sh).value.trim(), contract, startDate:$("#cf-start", sh).value, status:$("#cf-status", sh).value, notes:$("#cf-notes", sh).value.trim()};
    const ok = c ? await write(() => S.db.doc("clients/"+c.id).set({...strip(c), ...body, updatedAt:now, updatedBy:S.me||null}))
                 : await write(() => S.db.collection("clients").doc().set({...body, createdAt:now, createdBy:S.me||null}));
    if (ok){ closeModal(); toast(c?"حُفظ الزبون":"أُضيف الزبون"); }
  });
}

/* ---------- member form ---------- */
function memberForm(id){
  const m = id ? byId(S.members, id) : null;
  const v = m || {name:"", kind: S.members.filter(x=>x.kind==="partner").length < 2 ? "partner" : "member", share:"", phone:"", userId:""};
  const used = S.entries.some(e => [e.memberId,e.fromId,e.toId,e.beneficiaryId].includes(id));
  const sh = openModal(`${sheetHead(m?"تعديل":"إضافة شريك أو عضو أو صندوق")}
    <form id="mf" novalidate style="display:flex;flex-direction:column;gap:12px">
      <label class="fld"><span>الاسم</span><input type="text" id="mf-name" value="${esc(v.name)}" autofocus placeholder="اسم الشخص، أو مثال: صندوق المكتب، الحساب البنكي"></label>
      <div class="f2"><label class="fld"><span>الصفة</span><select id="mf-kind">${Object.entries(KIND).map(([k,l])=>`<option value="${k}" ${v.kind===k?"selected":""}>${l}</option>`).join("")}</select></label>
      <label class="fld" id="mf-share-w"><span>نسبة الشراكة %</span><input type="text" inputmode="decimal" dir="ltr" id="mf-share" value="${esc(v.share||"")}" placeholder="50"></label></div>
      <label class="fld"><span>الهاتف</span><input type="tel" dir="ltr" id="mf-phone" value="${esc(v.phone||"")}"></label>
      ${S.me?`<label class="row" style="gap:8px"><input type="checkbox" id="mf-me" ${v.userId===S.me?"checked":""}> <span>هذا أنا (يُختار تلقائيا عند تسجيل عملياتي)</span></label>`:""}
      <div class="err" id="mf-err" role="alert"></div>
      <div id="mf-del"></div>
      <div class="foot"><button class="btn pri" type="submit">حفظ</button><button class="btn" type="button" data-act="close">إلغاء</button>${m && !used && !S.readOnly ? `<button class="btn danger" type="button" data-act="del-member" data-id="${esc(m.id)}">حذف</button>`:""}</div>
    </form>`);
  const syncK = () => { $("#mf-share-w", sh).hidden = $("#mf-kind", sh).value !== "partner"; };
  syncK(); $("#mf-kind", sh).addEventListener("change", syncK);
  $("#mf", sh).addEventListener("submit", async ev => {
    ev.preventDefault();
    const name = $("#mf-name", sh).value.trim(); const kind = $("#mf-kind", sh).value;
    const share = kind === "partner" ? parseAmount($("#mf-share", sh).value || "0") : 0;
    if (!name) { $("#mf-err", sh).textContent = "اكتبوا الاسم."; return; }
    if (isNaN(share) || share < 0 || share > 100) { $("#mf-err", sh).textContent = "النسبة بين 0 و 100."; return; }
    const meBox = $("#mf-me", sh);
    let userId = v.userId || "";
    if (meBox) userId = meBox.checked ? S.me : (v.userId === S.me ? "" : v.userId || "");
    const now = new Date().toISOString();
    const body = {name, kind, share, phone:$("#mf-phone", sh).value.trim(), userId};
    let ok = true;
    if (meBox && meBox.checked){ for (const o of S.members) if (o.id !== id && o.userId === S.me) ok = ok && await write(() => S.db.doc("members/"+o.id).update({userId:""})); }
    ok = ok && (m ? await write(() => S.db.doc("members/"+m.id).set({...strip(m), ...body, updatedAt:now}))
                  : await write(() => S.db.collection("members").doc().set({...body, createdAt:now, createdBy:S.me||null})));
    if (ok){ closeModal(); toast("حُفظ"); }
  });
}

/* ---------- receipt viewer ---------- */
function receiptView(rid, type, eid){
  const isPdf = /pdf/.test(type);
  openModal(`${sheetHead("الفاتورة")}
    ${isPdf ? `<iframe src="/_blob/${esc(rid)}" title="فاتورة PDF"></iframe><a class="btn" href="/_blob/${esc(rid)}" target="_blank" rel="noopener">فتح الملف في نافذة جديدة</a>` : `<img src="/_blob/${esc(rid)}" alt="صورة الفاتورة">`}
    <div class="foot"><button class="btn" data-act="save-receipt" data-rid="${esc(rid)}" data-rtype="${esc(type)}">حفظ نسخة على الجهاز</button>${eid?`<button class="btn" data-act="entry" data-id="${esc(eid)}">رجوع للعملية</button>`:`<button class="btn" data-act="close">إغلاق</button>`}</div>`, "lb");
}
async function saveReceipt(rid, type){
  try {
    const dl = await claude.use("downloads"); if (!dl) { toast("الحفظ على الجهاز غير متاح هنا.", true); return; }
    const b = await (await fetch("/_blob/" + rid)).blob();
    const ext = /pdf/.test(type) ? "pdf" : /png/.test(type) ? "png" : /webp/.test(type) ? "webp" : "jpg";
    await dl.save({filename:`facture-${rid.slice(0,8)}.${ext}`, data:b});
  } catch(e){ if (!e || e.code !== "declined") toast("تعذّر حفظ الملف.", true); }
}

/* ---------- export ---------- */
async function exportCsv(){
  const list = filtered();
  const q = s => `"${String(s??"").replace(/"/g,'""')}"`;
  const head = ["التاريخ","الساعة","النوع","الزبون","الصنف","المبلغ","طريقة الدفع","استلم/دفع","من","إلى","لفائدة","المورد","رقم الفاتورة/الشيك","ملاحظة","عدد الفواتير","الحالة","سبب الإلغاء","وقت التسجيل"];
  const rows = list.map(e => { const d = new Date(e.at); return [fmtD(e.at), `${pad(d.getHours())}:${pad(d.getMinutes())}`, TYPE_LABEL[e.type], e.type==="transfer"?"":clientName(e.clientId), CAT_LABEL[e.category]||"", (e.type==="out"?-e.amount:e.amount).toFixed(2), METHOD_LABEL[e.method]||"", e.memberId?memberName(e.memberId):"", e.fromId?memberName(e.fromId):"", e.toId?memberName(e.toId):"", e.beneficiaryId?memberName(e.beneficiaryId):"", e.supplier||"", e.ref||"", e.note||"", (e.receipts||[]).length, e.void?"ملغاة":"سارية", e.voidReason||"", fmtDT(e.createdAt)]; });
  const csv = "﻿" + [head, ...rows].map(r => r.map(q).join(",")).join("\r\n");
  const d = new Date(); const fn = `operations-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.csv`;
  try {
    const dl = await claude.use("downloads");
    if (dl){ await dl.save({filename:fn, data:csv}); return; }
  } catch(e){ if (e && e.code === "declined") return; }
  openModal(`${sheetHead("نسخ البيانات")}<p class="muted" style="margin:0">الحفظ المباشر غير متاح هنا. انسخوا النص والصقوه في Excel.</p><textarea id="csv-t" style="min-height:240px" dir="ltr" readonly>${esc(csv.slice(1))}</textarea><div class="foot"><button class="btn pri" data-act="copy-csv">نسخ</button><button class="btn" data-act="close">إغلاق</button></div>`);
}

/* ---------- events ---------- */
document.addEventListener("click", async ev => {
  const scrim = ev.target.closest("[data-scrim]"); if (scrim && ev.target === scrim) { closeModal(); return; }
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a){
    case "tab": S.tab = el.dataset.tab; S.clientId = null; try{ localStorage.setItem("ledger.tab", S.tab); }catch(_){} draw(); window.scrollTo(0,0); break;
    case "client": S.tab = "clients"; S.clientId = id; draw(); window.scrollTo(0,0); break;
    case "back": S.clientId = null; draw(); break;
    case "new-entry":
      if (!S.members.length && !S.clients.length) toast("أضيفوا الأعضاء والزبائن أولا لتسجيل العمليات بدقة.");
      entryForm({type:el.dataset.type, clientId:el.dataset.client||(S.tab==="clients"?S.clientId:"")||""}); break;
    case "entry": entryDetail(id); break;
    case "edit-entry": closeModal(); entryForm({}, id); break;
    case "void": voidBox(id); break;
    case "void-no": $("#void-box").innerHTML = ""; break;
    case "void-ok": {
      const r = $("#void-r").value.trim(); if (!r) { $("#void-err").textContent = "اكتبوا سبب الإلغاء."; return; }
      const e = byId(S.entries, id); const now = new Date().toISOString();
      if (await write(() => S.db.doc("entries/"+id).update({void:true, voidReason:r, voidAt:now, voidBy:S.me||null, history:(e.history||[]).concat([{at:now, by:S.me||null, prev:{}, action:"void", reason:r}])}))) { closeModal(); toast("أُلغيت العملية وبقيت في السجل"); }
      break; }
    case "restore": {
      const e = byId(S.entries, id); const now = new Date().toISOString();
      if (await write(() => S.db.doc("entries/"+id).update({void:false, history:(e.history||[]).concat([{at:now, by:S.me||null, prev:{}, action:"restore"}])}))) { closeModal(); toast("أُعيد تفعيل العملية"); }
      break; }
    case "receipt": receiptView(el.dataset.rid, el.dataset.rtype, el.dataset.eid); break;
    case "save-receipt": saveReceipt(el.dataset.rid, el.dataset.rtype); break;
    case "new-client": clientForm(); break;
    case "edit-client": clientForm(id); break;
    case "del-client": {
      if (el.dataset.sure){ if (await write(() => S.db.doc("clients/"+id).delete())) { S.clientId = null; draw(); toast("حُذف الزبون"); } }
      else { el.dataset.sure = "1"; el.textContent = "اضغطوا مرة أخرى لتأكيد الحذف"; }
      break; }
    case "new-member": memberForm(); break;
    case "edit-member": if (!S.readOnly) memberForm(id); break;
    case "del-member": {
      if (el.dataset.sure){ if (await write(() => S.db.doc("members/"+id).delete())) { closeModal(); toast("حُذف"); } }
      else { el.dataset.sure = "1"; el.textContent = "اضغطوا مرة أخرى للتأكيد"; }
      break; }
    case "save-settings": {
      const body = {company:$("#st-co").value.trim(), currency:$("#st-cur").value.trim() || "دج"};
      if (await write(() => S.db.doc("settings/main").set(body))) toast("حُفظت الإعدادات");
      break; }
    case "export": exportCsv(); break;
    case "copy-csv": { const t = $("#csv-t"); try { await navigator.clipboard.writeText(t.value); toast("نُسخ"); } catch(_){ t.select(); } break; }
    case "clear-f": S.f = {q:"", type:"", client:"", member:"", month:""}; draw(); break;
    case "close": closeModal(); break;
  }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && $("#modal-root").innerHTML) closeModal();
  if (ev.key === "Enter" && ev.target.matches && ev.target.matches("tr[data-act]")) ev.target.click();
});
$("#main").addEventListener("input", ev => {
  const t = ev.target;
  const map = {fq:"q", ft:"type", fc:"client", fm:"member", fmo:"month"};
  if (map[t.id]) { S.f[map[t.id]] = t.value; draw(); }
  else if (t.id === "cq") { S.cq = t.value; draw(); }
});

/* ---------- boot ---------- */
async function boot(){
  draw();
  const use = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(()=>null) : Promise.resolve(null);
  const [db, user, assets] = await Promise.all([use("db"), use("user"), use("assets")]);
  S.user = user; S.assets = assets;
  if (!db){ S.noDb = true; draw(); return; }
  S.db = db;
  if (user){
    try { S.meProfile = await user.me(); S.me = S.meProfile.id; } catch(_){}
    try { const c = await user.can("data.write"); if (c === false) S.readOnly = true; } catch(_){}
  }
  const done = k => { S.loaded[k] = true; if (S.loaded.clients && S.loaded.entries && S.loaded.members) S.ready = true; render(); };
  const onErr = e => { if (e && (e.code === "revoked" || e.code === "not_granted")) { S.readOnly = true; } S.ready = true; toast("تعذّر تحميل جزء من الدفتر. أعيدوا فتح الصفحة.", true); render(); };
  db.collection("clients").onSnapshot(s => { S.clients = s.docs.map(d => ({id:d.id, ...d.data()})); done("clients"); }, onErr);
  db.collection("members").onSnapshot(s => { S.members = s.docs.map(d => ({id:d.id, ...d.data()})); done("members"); }, onErr);
  db.collection("entries").onSnapshot(s => { S.entries = s.docs.map(d => { const x = d.data(); return {id:d.id, ...x, amount:Number(x.amount)||0}; }); done("entries"); }, onErr);
  db.doc("settings/main").onSnapshot(s => { S.settings = s.exists ? s.data() : {}; render(); }, () => {});
}
boot();
})();
</script>
