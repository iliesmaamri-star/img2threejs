<title>دفتر حسابات الورشات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap">
<style>
/* Layout: a site ledger. Sticky header with tabs, one working column (max 1120px); cards only for summaries and sheets. */
:root{
  --bg:#ECEEEA; --surface:#FAFBF8; --sunk:#E1E4DF; --line:#C9CEC7; --fg:#1A201D; --muted:#5B655E;
  --accent:#24479A; --accent-ink:#FFFFFF; --accent-soft:#DDE4F4;
  --in:#1D7146; --in-soft:#DCEFE2; --out:#AB3327; --out-soft:#F5DFDA; --warn:#94600A; --warn-soft:#F5E9CF;
  --shadow:0 1px 2px rgba(20,32,26,.08),0 10px 28px rgba(20,32,26,.10);
  --scrim:rgba(18,24,21,.45);
  --f-display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131715; --surface:#1B201D; --sunk:#232925; --line:#343C37; --fg:#E6EBE7; --muted:#99A49C;
  --accent:#93B0F0; --accent-ink:#0E1830; --accent-soft:#223050;
  --in:#6CC693; --in-soft:#1A3326; --out:#EE8B7D; --out-soft:#3C221E; --warn:#E2B45C; --warn-soft:#382D17;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#131715; --surface:#1B201D; --sunk:#232925; --line:#343C37; --fg:#E6EBE7; --muted:#99A49C;
  --accent:#93B0F0; --accent-ink:#0E1830; --accent-soft:#223050;
  --in:#6CC693; --in-soft:#1A3326; --out:#EE8B7D; --out-soft:#3C221E; --warn:#E2B45C; --warn-soft:#382D17;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6); color-scheme:dark }

body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
#app{min-height:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.35}
.num{font-variant-numeric:tabular-nums;unicode-bidi:isolate;white-space:nowrap}
.cur{color:var(--muted);font-size:.85em}
.mono{font-family:var(--f-mono);font-size:.85em;unicode-bidi:isolate;white-space:nowrap}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:12px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand h1{font-size:1.15rem}
.brand .sub{font-size:.8rem;color:var(--muted)}
.mark{width:34px;height:34px;flex:none}
.brand-l{display:flex;align-items:center;gap:10px;min-width:0}
.who{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.who img{width:22px;height:22px;border-radius:50%}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab:hover{color:var(--fg)}

main{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 120px;display:flex;flex-direction:column;gap:22px}
section{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:1.02rem}
.label{font-size:.74rem;letter-spacing:.02em;color:var(--muted);font-weight:600}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.in{background:var(--in);border-color:var(--in);color:var(--surface)}
.btn.out{background:var(--out);border-color:var(--out);color:var(--surface)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.danger{color:var(--out);border-color:var(--out)}
.btn[disabled]{opacity:.55;cursor:wait}
.btn svg{width:16px;height:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-size:1.35rem;font-weight:700;font-family:var(--f-body)}
.kpi .v.in{color:var(--in)} .kpi .v.out{color:var(--out)}
.kpi .h{font-size:.78rem;color:var(--muted)}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* alerts */
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--fg);border-inline-start:4px solid var(--warn)}
.alert b{color:var(--warn)}
.alert.bad{background:var(--out-soft);border-inline-start-color:var(--out)}
.alert.bad b{color:var(--out)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.75rem;color:var(--muted);font-weight:600;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:end}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--sunk)}
.pos{color:var(--in)} .neg{color:var(--out)}

.pill{display:inline-block;font-size:.72rem;padding:1px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);font-weight:600;white-space:nowrap}
.pill.active{background:var(--accent-soft);color:var(--accent)}
.pill.done{background:var(--in-soft);color:var(--in)}
.pill.paused{background:var(--warn-soft);color:var(--warn)}
.pill.void{background:var(--out-soft);color:var(--out)}

/* operations list */
.ops{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.op{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:start;cursor:pointer;width:100%}
.op:last-child{border-bottom:0}
.op:hover{background:var(--sunk)}
.op .ic{grid-row:span 2;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:1.05rem}
.op .ic.in{background:var(--in-soft);color:var(--in)} .op .ic.out{background:var(--out-soft);color:var(--out)} .op .ic.transfer{background:var(--accent-soft);color:var(--accent)}
.op .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op .a{font-weight:700;text-align:end}
.op .a.in{color:var(--in)} .op .a.out{color:var(--out)} .op .a.transfer{color:var(--accent)}
.op .s{font-size:.8rem;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op .m{font-size:.78rem;color:var(--muted);text-align:end;display:flex;gap:8px;align-items:center;justify-content:flex-end}
.op .m svg{width:13px;height:13px}
.op.void .t,.op.void .a{text-decoration:line-through;opacity:.6}
.op .rb{font-size:.75rem;color:var(--muted)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0;text-align:start}
button.card{cursor:pointer} button.card:hover{border-color:var(--muted)}
.card h3{font-size:.98rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.88rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:end}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.bar .bi{background:var(--in)} .bar .bo{background:var(--out)}
.cat-bars{display:flex;flex-direction:column;gap:8px}
.cat-bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;font-size:.85rem}
.cat-bar .track{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.cat-bar .fill{height:100%;background:var(--out);border-radius:99px}

.hero{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.hero h2{font-size:1.35rem}
.back{align-self:flex-start}

/* onboarding */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;counter-reset:s}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.step .no{font-family:var(--f-display);font-size:1.6rem;color:var(--accent);line-height:1}
.step.ok{border-color:var(--in)} .step.ok .no{color:var(--in)}
@media (max-width:760px){.steps{grid-template-columns:1fr}}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

/* filters */
.filters{display:grid;grid-template-columns:2fr repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:860px){.filters{grid-template-columns:1fr 1fr}.filters .q{grid-column:1/-1}}

/* forms */
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld > span{font-size:.8rem;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=tel],input[type=date],input[type=month],input[type=datetime-local],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;min-height:42px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.f2{grid-template-columns:1fr}}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg label{display:block;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:9px 6px;font-weight:600;color:var(--muted);border-inline-start:1px solid var(--line)}
.seg label:first-child span{border-inline-start:0}
.seg input:checked + span.in{background:var(--in);color:var(--surface)}
.seg input:checked + span.out{background:var(--out);color:var(--surface)}
.seg input:checked + span.transfer{background:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:-3px}
.amt-in{font-size:1.4rem;font-weight:700;text-align:start}
.stamp{font-size:.8rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.err{color:var(--out);font-size:.85rem;min-height:1.2em}

/* receipts */
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--sunk);display:grid;place-items:center;cursor:pointer;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .pdf{font-family:var(--f-mono);font-weight:500;color:var(--out)}
.thumb .x{position:absolute;top:3px;inset-inline-end:3px;width:22px;height:22px;border-radius:50%;border:0;background:var(--scrim);color:#fff;cursor:pointer;line-height:1}
.drop{border:1px dashed var(--line);border-radius:9px;padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.drop input[type=file]{display:none}

/* modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;box-shadow:var(--shadow);padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:14px;max-height:88vh}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-h h2{font-size:1.1rem}
.x-btn{border:0;background:var(--sunk);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.1rem}
.sheet .foot{display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap;position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--surface);padding-block:10px;margin-bottom:-10px;border-top:1px solid var(--line)}
.lb{max-width:960px}
.lb img{width:100%;height:auto;border-radius:8px;background:var(--sunk)}
.lb iframe{width:100%;height:70vh;border:1px solid var(--line);border-radius:8px;background:#fff}
.hist{font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:10px}

.fab{position:fixed;inset-inline-end:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;border:0;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:14px 20px;box-shadow:var(--shadow);cursor:pointer;display:flex;gap:8px;align-items:center;font-size:1rem}
.fab svg{width:20px;height:20px}
.toast{position:fixed;inset-inline-start:50%;transform:translateX(50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:8px;box-shadow:var(--shadow);font-weight:500;max-width:calc(100% - 32px)}
.toast.bad{background:var(--out);color:var(--surface)}
.notice{background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:.9rem}
.skel{height:84px;border-radius:var(--r);background:linear-gradient(90deg,var(--sunk),var(--surface),var(--sunk));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.split{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.hold{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.hold div{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.hold div:last-child{border-bottom:0}
.hold .tot{background:var(--sunk);font-weight:700}
/* project account */
.pbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr-h,112px));z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:6px 14px;flex-wrap:wrap;box-shadow:var(--shadow)}
.pbar .pn{display:flex;flex-direction:column;min-width:0}
.pbar .pn b{font-family:var(--f-display);font-size:.98rem}
.pbar .pn span{font-size:.8rem;color:var(--muted)}
.pbar .pv{display:flex;align-items:center;gap:8px;font-weight:700;flex-wrap:wrap}
.pill.low{background:var(--out-soft);color:var(--out)}
.pill.ok{background:var(--in-soft);color:var(--in)}
.lastpay{font-size:.88rem;color:var(--muted)}
.lastpay b{color:var(--fg)}
.qa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:560px){.qa{grid-template-columns:repeat(2,minmax(0,1fr))}}
.qa .btn{justify-content:center;padding:12px 8px;text-align:center}
.qa.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.balbar{position:relative;height:14px;border-radius:99px;background:var(--sunk)}
.balbar .f{display:block;height:100%;border-radius:99px;background:var(--in)}
.balbar.low .f{background:var(--out)}
.balbar .thr{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--warn)}
.balcap{display:flex;justify-content:space-between;gap:10px;font-size:.78rem;color:var(--muted)}
.alert.low{flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.alert.low .low-b{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 260px}
.alert.low .low-t{font-size:1.05rem}
.alert .kv{font-size:.88rem}
.phases{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.ph{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(60px,22%) auto;gap:10px;align-items:center;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;text-align:start;width:100%}
.ph:last-child{border-bottom:0}
.ph:hover{background:var(--sunk)}
.ph-no{font-family:var(--f-display);color:var(--accent);font-size:.9rem}
.ph.zero .ph-n,.ph.zero .ph-v{color:var(--muted)}
.ph-bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;display:block}
.ph-bar span{display:block;height:100%;background:var(--out)}
.ph-v{font-weight:600;text-align:end}
@media (max-width:560px){.ph{grid-template-columns:24px minmax(0,1fr) auto}.ph-bar{display:none}}
.tl{display:flex;flex-direction:column;gap:14px}
.day{display:flex;flex-direction:column;gap:6px}
.day-h{font-size:.8rem;font-weight:600;color:var(--muted)}
details.more{border:1px solid var(--line);border-radius:9px;padding-inline:12px}
details.more>summary{cursor:pointer;padding-block:10px;color:var(--accent);font-weight:600;list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"+ "}
details.more[open]>summary::before{content:"− "}
details.more[open]{padding-bottom:12px}
details.more .inner{display:flex;flex-direction:column;gap:10px}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:0;background:var(--sunk);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.calc div{background:var(--sunk);box-shadow:0 0 0 .5px var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-size:.78rem;color:var(--muted)}
.calc b{color:var(--fg);font-size:.95rem}
.calc .hl b{color:var(--accent)}
.chooser{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ch{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:14px;text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.ch:hover{border-color:var(--muted)}
.ch b{font-size:1rem}
.ch.in b{color:var(--in)} .ch.out b{color:var(--out)} .ch.acc b{color:var(--accent)}
.ch span{font-size:.8rem;color:var(--muted)}
@media (max-width:420px){.chooser{grid-template-columns:1fr}}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gi{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:start;min-width:0}
.gi .im{aspect-ratio:1/1;background:var(--sunk);display:grid;place-items:center;max-width:100%;overflow:hidden}
.gi .im img{width:100%;height:100%;object-fit:cover}
.gi .cap{padding:8px 10px;font-size:.78rem;display:flex;flex-direction:column;gap:2px;min-width:0}
.gi .cap span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill.st-sent{background:var(--accent-soft);color:var(--accent)}
.pill.st-unpaid{background:var(--out-soft);color:var(--out)}
.pill.st-partial{background:var(--warn-soft);color:var(--warn)}
.pill.st-paid{background:var(--in-soft);color:var(--in)}
.pill.st-cancelled{text-decoration:line-through}

<script>
(function(){
"use strict";
document.documentElement.lang = "ar";

/* ---------- constants ---------- */
const pad = n => String(n).padStart(2,"0");
const OFFICE = "_office";
const CAT = {
  in: [["advance","دفعة مسبقة"],["installment","دفعة مرحلية"],["final","الدفعة النهائية"],["extra","أشغال إضافية"],["other_in","دخل آخر"]],
  out: [["materials","مواد البناء"],["labor","أجور العمال"],["subcontract","مقاول من الباطن"],["equipment","كراء معدات وآلات"],["transport","نقل وشحن"],["fuel","وقود"],["permits","وثائق ورخص"],["office","مصاريف المكتب"],["draw","سحب أرباح شريك"],["other_out","مصروف آخر"]],
};
const OFFICE_OUT = [["office","مصاريف المكتب (كراء، كهرباء، هاتف…)"],["draw","سحب أرباح شريك"],["transport","نقل وتنقلات"],["fuel","وقود"],["permits","وثائق ورخص"],["equipment","معدات وأدوات"],["other_out","مصروف آخر"]];
const OFFICE_IN = [["other_in","دخل للمكتب"]];
const CAT_LABEL = Object.fromEntries([...CAT.in, ...CAT.out, ["transfer","تحويل بين الأعضاء"], ["fee","أتعاب المكتب"]]);
const METHODS = [["cash","نقدا (Cash)"],["bank","تحويل بنكي"],["cheque","شيك"],["ccp","CCP / BaridiMob"],["other","أخرى"]];
const METHOD_LABEL = Object.fromEntries([...METHODS, ["card","بطاقة"]]);
const KIND = {partner:"شريك", member:"عضو", account:"صندوق / حساب بنكي"};
const STATUS = {active:"قيد الإنجاز", done:"منتهي", paused:"متوقف"};
const TYPE_LABEL = {in:"دخل", out:"مصروف", transfer:"تحويل", fee:"أتعاب"};
const XKIND = {material:"المواد والمشتريات", labor:"اليد العاملة", other:"مصاريف أخرى"};
const FEES = [["office","أتعاب المكتب · Office Fee"],["study","أتعاب الدراسة · Study Fee"],["supervision","أتعاب المتابعة · Supervision Fee"],["management","أتعاب التسيير · Management Fee"],["other","أتعاب أخرى"]];
const FEE_LABEL = Object.fromEntries(FEES);
const DEFAULT_PHASES = ["تهيئة الورشة والحفر","الأساسات","الهيكل الخرساني","البناء بالطوب","الكهرباء","السباكة والصرف","التلييس والعزل","الأرضيات والتبليط","الجبس والأسقف","النجارة والألمنيوم والزجاج","الدهان","التكييف والتجهيزات","الواجهات والأعمال الخارجية","التشطيبات النهائية والتسليم"].map((name,i) => ({id:"p"+pad(i+1), name}));
const UNITS = ["قضيب","كيس","m³","m²","m","طن","kg","وحدة","شاحنة","لتر","علبة","يوم"];
const SPECIALTIES = ["بنّاء","حداد","نجار خرسانة","كهربائي","سبّاك","مبلّط","جبّاس","دهّان","نجار ألمنيوم","عامل","سائق","مقاول من الباطن"];
const REQ = {draft:["مسودة","Draft"], sent:["مُرسل","Sent"], unpaid:["غير مدفوع","Unpaid"], partial:["مدفوع جزئيا","Partially Paid"], paid:["مدفوع","Paid"], cancelled:["ملغى","Cancelled"]};
const DEFAULT_REASON = "Versement pour poursuite des travaux.";
const TABS = [["home","الرئيسية"],["clients","الزبائن والمشاريع"],["ops","سجل العمليات"],["people","الفريق والعمال"],["settings","الإعدادات"]];
const ICON_CLIP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.5l-8.5 8.5a5 5 0 01-7-7L14 5.5a3.4 3.4 0 014.8 4.8l-8.4 8.4a1.7 1.7 0 01-2.4-2.4L15.5 8.8"/></svg>';
const TAB_ID = Math.random().toString(36).slice(2);
const AUDIT_KEYS = ["type","amount","at","clientId","phaseId","kind","category","item","desc","qty","unit","unitPrice","supplier","workerId","jobId","requestId","feeKind","memberId","fromId","toId","beneficiaryId","method","ref","note"];
const KEY_LABEL = {amount:"المبلغ",at:"التاريخ والساعة",clientId:"المشروع",phaseId:"المرحلة",kind:"نوع المصروف",category:"الصنف",item:"البيان",desc:"الوصف",qty:"الكمية",unit:"الوحدة",unitPrice:"سعر الوحدة",supplier:"المورد",workerId:"العامل",jobId:"العمل",requestId:"طلب الدفع",feeKind:"نوع الأتعاب",memberId:"العضو",fromId:"من",toId:"إلى",beneficiaryId:"الشريك",method:"طريقة الدفع",ref:"المرجع",note:"الملاحظة",type:"النوع",reason:"السبب",notes:"الملاحظات",date:"التاريخ",due:"تاريخ الاستحقاق",agreed:"المبلغ المتفق عليه",name:"الاسم",specialty:"التخصص",phone:"الهاتف",project:"المشروع",location:"الموقع",contract:"قيمة العقد",status:"الحالة",lowPct:"حد التنبيه",startDate:"بداية الأشغال"};

/* ---------- state ---------- */
const S = {
  ready:false, noDb:false, db:null, user:null, assets:null,
  clients:[], entries:[], members:[], workers:[], jobs:[], requests:[], settings:{}, phasesDoc:null,
  loaded:{clients:false, entries:false, members:false, workers:false, jobs:false, requests:false},
  me:null, meProfile:null, readOnly:false, canEdit:false, prof:{}, profAsked:new Set(),
  tab:"home", clientId:null, pview:"dash", phaseId:"", workerId:null, audit:false, cq:"",
  f:{q:"", type:"", client:"", member:"", month:""},
  setDraft:null, phDraft:null, phNew:"",
};
try{ const t = localStorage.getItem("ledger.tab"); if (t && TABS.some(x=>x[0]===t)) S.tab = t; }catch(_){}

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = new Intl.NumberFormat("fr-FR", {minimumFractionDigits:0, maximumFractionDigits:2});
const nf2 = new Intl.NumberFormat("fr-FR", {minimumFractionDigits:2, maximumFractionDigits:2});
const cur = () => S.settings.currency || "دج";
const curCode = () => S.settings.currencyCode || "DZD";
const sleep = ms => new Promise(r => setTimeout(r, ms));
/* wait until a saved change is visible in the live data (own writes arrive through the subscription) */
async function until(fn, ms=4000){ const t0 = Date.now(); while (!fn() && Date.now() - t0 < ms) await sleep(50); return !!fn(); }
const useCap = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(()=>null) : Promise.resolve(null);
function money(n, sign){
  const v = Number(n)||0;
  let s = nf.format(Math.abs(v));
  if (sign === "in") s = "+" + s; else if (sign === "out") s = "−" + s; else if (v < 0) s = "−" + s;
  return `<span class="num" dir="ltr">${s}</span> <span class="cur">${esc(cur())}</span>`;
}
const pctTxt = p => p == null ? "—" : nf.format(Math.round(p*10)/10) + "%";
function fmtD(iso){ if(!iso) return ""; const d = new Date(iso); if (isNaN(d)) return ""; return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`; }
function fmtT(iso){ if(!iso) return ""; const d = new Date(iso); if (isNaN(d)) return ""; return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
const fmtDT = iso => iso ? `${fmtD(iso)} ${fmtT(iso)}` : "";
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const todayStr = () => ymd(new Date());
const ymdToFr = s => s ? s.split("-").reverse().join("/") : "";
const dt = iso => `<span class="mono" dir="ltr">${esc(fmtDT(iso))}</span>`;
const tm = iso => `<span class="mono" dir="ltr">${esc(fmtT(iso))}</span>`;
let dayFmt; try { dayFmt = new Intl.DateTimeFormat("ar-DZ", {weekday:"long"}); } catch(_){ dayFmt = null; }
const dayName = iso => { try { return dayFmt ? dayFmt.format(new Date(iso)) : ""; } catch(_){ return ""; } };
function parseNum(s){
  let t = String(s ?? "").trim().replace(/[\s  ]/g,"").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
  if (!t) return NaN;
  const lc = t.lastIndexOf(","), ld = t.lastIndexOf(".");
  if (lc >= 0 && ld >= 0){ const dec = lc > ld ? "," : "."; const th = dec === "," ? "." : ","; t = t.split(th).join("").replace(dec, "."); }
  else if (lc >= 0 || ld >= 0){
    const parts = t.split(lc >= 0 ? "," : ".");
    const last = parts[parts.length-1];
    t = (parts.length > 2 || (last.length === 3 && !/^-?0$/.test(parts[0]))) ? parts.join("") : parts.join(".");
  }
  if (!/^-?\d+(\.\d+)?$/.test(t)) return NaN;
  return Math.round(Number(t)*100)/100;
}
const byId = (list, id) => list.find(x => x.id === id);
const clientName = id => id === OFFICE ? "حساب المكتب" : (byId(S.clients,id)?.name || "زبون محذوف");
const memberName = id => id ? (byId(S.members,id)?.name || "عضو محذوف") : "غير محدد";
const workerName = id => byId(S.workers,id)?.name || "عامل محذوف";
const personName = uid => (uid && S.prof[uid] && S.prof[uid].name) || "أحد الأعضاء";
const myMember = () => S.me ? S.members.find(m => m.userId === S.me) : null;
const active = () => S.entries.filter(e => !e.void);
const reqNo = r => r ? String(r.no || 0).padStart(3,"0") : "";
function sortEntries(list){ return list.slice().sort((a,b) => (b.at||"").localeCompare(a.at||"") || (b.createdAt||"").localeCompare(a.createdAt||"")); }
const strip = o => { const c = {...o}; delete c.id; return c; };

/* ---------- phases ---------- */
function phaseList(){ const l = S.phasesDoc && Array.isArray(S.phasesDoc.list) && S.phasesDoc.list.length ? S.phasesDoc.list : DEFAULT_PHASES; return l; }
const activePhases = () => phaseList().filter(p => !p.hidden);
const phaseName = id => !id ? "بدون مرحلة" : (phaseList().find(p => p.id === id)?.name || "مرحلة محذوفة");

/* ---------- money calculations (all derived from transactions, never stored) ---------- */
const kindOf = e => e.kind || ({materials:"material", labor:"labor", subcontract:"labor"}[e.category] || "other");
const entriesFor = cid => cid === OFFICE ? S.entries.filter(e => e.clientId === OFFICE || e.type === "fee") : S.entries.filter(e => e.clientId === cid);
function delta(e, cid){
  if (e.void) return 0;
  if (e.type === "in") return e.amount;
  if (e.type === "out") return -e.amount;
  if (e.type === "fee") return cid === OFFICE ? e.amount : -e.amount;
  return 0;
}
function clientTotals(cid){
  let i = 0, o = 0;
  for (const e of entriesFor(cid)){ const d = delta(e, cid); if (d > 0) i += d; else o -= d; }
  return {i, o, b:i-o};
}
function companyTotals(){ let i=0,o=0; for (const e of active()){ if (e.type==="in") i+=e.amount; else if (e.type==="out") o+=e.amount; } return {i, o, b:i-o}; }
function lowPctFor(c){ const v = c && c.lowPct != null && c.lowPct !== "" ? Number(c.lowPct) : Number(S.settings.lowPct ?? 10); return isFinite(v) ? v : 10; }
function projStats(cid){
  const c = byId(S.clients, cid) || {};
  let paid = 0, spent = 0, fees = 0, last = null, n = 0;
  const k = {material:0, labor:0, other:0};
  for (const e of S.entries){
    if (e.void || e.clientId !== cid) continue;
    n++;
    if (e.type === "in"){ paid += e.amount; if (!last || (e.at||"") > (last.at||"")) last = e; }
    else if (e.type === "out"){ spent += e.amount; k[kindOf(e)] += e.amount; }
    else if (e.type === "fee") fees += e.amount;
  }
  const out = spent + fees, bal = paid - out;
  const pct = paid > 0 ? bal / paid * 100 : null;
  const thr = lowPctFor(c);
  const low = (paid > 0 && pct <= thr) || bal < 0;
  const contract = Number(c.contract) || 0;
  return {paid, spent, fees, out, bal, pct, thr, low, last, k, n, contract, remaining: contract ? Math.max(contract - paid, 0) : 0};
}
function reqPaid(rid){ let p = 0; for (const e of S.entries) if (!e.void && e.type === "in" && e.requestId === rid) p += e.amount; return p; }
function reqStatus(r){
  if (r.cancelled) return "cancelled";
  const p = reqPaid(r.id);
  if (p >= r.amount - 0.005) return "paid";
  if (p > 0) return "partial";
  if (!r.sentAt) return "draft";
  if (r.due && todayStr() > r.due) return "unpaid";
  return "sent";
}
const isOpen = r => !["paid","cancelled"].includes(reqStatus(r));
const openRequests = cid => S.requests.filter(r => r.clientId === cid && isOpen(r)).sort((a,b) => (a.no||0) - (b.no||0));
const outstanding = cid => openRequests(cid).reduce((s,r) => s + Math.max(r.amount - reqPaid(r.id), 0), 0);
function suggestAmount(cid){
  const st = projStats(cid);
  const base = st.last ? st.last.amount : (st.contract ? st.contract * 0.2 : 0);
  let s = base - st.bal;
  if (st.contract && st.remaining > 0) s = Math.min(s, st.remaining);
  if (!(s > 0)) return 0;
  return Math.ceil(s / 10000) * 10000;
}
function phaseCosts(cid){
  const m = {};
  for (const e of S.entries){
    if (e.void || e.clientId !== cid || e.type !== "out") continue;
    const k = e.phaseId || "";
    const r = m[k] || (m[k] = {material:0, labor:0, other:0, total:0, n:0});
    r[kindOf(e)] += e.amount; r.total += e.amount; r.n++;
  }
  return m;
}
const jobKey = (cid, ph, wid) => `${cid}__${ph || "none"}__${wid}`;
function jobPaid(jid, exceptId){ let p = 0; for (const e of S.entries) if (!e.void && e.type === "out" && e.jobId === jid && e.id !== exceptId) p += e.amount; return p; }
function workerStats(wid){
  const jobs = S.jobs.filter(j => j.workerId === wid);
  let due = 0, rem = 0, paid = 0;
  for (const j of jobs){ const a = Number(j.agreed) || 0; due += a; if (a) rem += Math.max(a - jobPaid(j.id), 0); }
  const pays = S.entries.filter(e => e.type === "out" && e.workerId === wid);
  for (const e of pays) if (!e.void) paid += e.amount;
  const projects = [...new Set([...jobs.map(j => j.clientId), ...pays.map(e => e.clientId)])];
  return {jobs, due, paid, rem, pays, projects};
}
function holdings(){
  const h = {};
  const add = (k,v) => { h[k||""] = (h[k||""]||0) + v; };
  for (const e of active()){
    if (e.type==="in") add(e.memberId, e.amount);
    else if (e.type==="out") add(e.memberId, -e.amount);
    else if (e.type==="transfer"){ add(e.fromId, -e.amount); add(e.toId, e.amount); }
  }
  return h;
}
function diff(old, next, keys){
  const prev = {};
  for (const k of keys){ const a = old[k] ?? "", b = next[k] ?? ""; if (k in next && String(a) !== String(b)) prev[k] = a; }
  return prev;
}

/* ---------- feedback ---------- */
let toastT;
function toast(msg, bad){ const t = $("#toast"); t.textContent = msg; t.className = "toast" + (bad?" bad":""); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=>{ t.hidden = true; }, bad?5000:2600); }
function errMsg(e){
  const c = e && e.code;
  if (c === "quota_exceeded" || c === "quota_or_state") return "امتلأت مساحة التخزين. احذفوا ملفات قديمة ثم أعيدوا المحاولة.";
  if (c === "invalid_argument") return "لا تملك صلاحية هذا التعديل. اطلب من صاحب الدفتر الصلاحية المناسبة.";
  if (c === "too_large") return "الملف أكبر من 20 ميغابايت. صوّروا الفاتورة بدقة أقل.";
  if (c === "unsupported_type") return "نوع الملف غير مقبول. استعملوا صورة JPG أو PNG أو ملف PDF.";
  if (c === "rate_limited" || c === "resource_exhausted") return "طلبات كثيرة في وقت قصير. انتظروا قليلا ثم أعيدوا المحاولة.";
  if (c === "not_granted" || c === "revoked") return "لم يعد لديك وصول للحفظ في هذا الدفتر.";
  if (c === "busy") return "عضو آخر يُصدر طلب دفع الآن. أعيدوا المحاولة بعد ثوانٍ.";
  return "تعذّر الحفظ. تحقّقوا من الاتصال ثم أعيدوا المحاولة.";
}
async function write(fn){
  try { await fn(); return true; }
  catch(e){
    if (e && e.code === "unavailable"){ await sleep(600+Math.random()*600); try { await fn(); return true; } catch(e2){ toast(errMsg(e2), true); return false; } }
    toast(errMsg(e), true); return false;
  }
}

/* ---------- rendering ---------- */
let raf = 0;
function render(){ if (raf) return; raf = requestAnimationFrame(()=>{ raf = 0; draw(); }); }
function draw(){
  const a = document.activeElement, aid = a && a.id && $("#main").contains(a) ? a.id : null;
  let ss=null, se=null; try { if (aid){ ss = a.selectionStart; se = a.selectionEnd; } } catch(_){}
  $("#hdr").innerHTML = header();
  $("#main").innerHTML = view();
  $("#fab").hidden = !(S.ready && S.db && !S.readOnly);
  if (aid){ const el = document.getElementById(aid); if (el){ el.focus(); try { if (ss!=null) el.setSelectionRange(ss, se); } catch(_){} } }
  resolveProfiles();
}
function go(patch){ Object.assign(S, patch); try{ localStorage.setItem("ledger.tab", S.tab); }catch(_){} draw(); window.scrollTo(0,0); }

function header(){
  const co = S.settings.company || "دفتر حسابات الورشات";
  const mm = myMember();
  const role = S.readOnly ? "اطّلاع فقط" : S.canEdit ? "محرّر" : "مساهم";
  const who = S.meProfile ? `<span class="who"><img src="${esc(S.meProfile.avatarUrl)}" alt=""><span>${esc(S.meProfile.name || "أنت")}${mm ? " · " + esc(mm.name) : ""} · ${role}</span></span>` : "";
  return `<div class="brand">
    <div class="brand-l">
      <svg class="mark" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="7" fill="var(--accent)"/><path d="M8 25V14l9-6 9 6v11" fill="none" stroke="var(--accent-ink)" stroke-width="2.2" stroke-linejoin="round"/><path d="M13 25v-6h8v6M8 25h18" fill="none" stroke="var(--accent-ink)" stroke-width="2.2" stroke-linecap="round"/></svg>
      <div><h1>${esc(co)}</h1><div class="sub">متابعة أموال كل زبون ومشروع</div></div>
    </div>${who}</div>
    <nav class="tabs" aria-label="الأقسام">${TABS.map(([k,l]) => `<button class="tab" data-act="tab" data-tab="${k}" ${S.tab===k?'aria-current="page"':""}>${l}</button>`).join("")}</nav>`;
}

function view(){
  if (S.noDb) return `<section><div class="empty"><h2>الدفتر غير متصل بالتخزين</h2><p>افتحوا هذه الصفحة من حسابكم على claude.ai مع تسجيل الدخول، حتى تُحفظ العمليات وتظهر لكل أعضاء المكتب.</p></div></section>`;
  if (!S.ready) return `<section><div class="skel"></div><div class="skel"></div><p class="muted">جارٍ تحميل الدفتر…</p></section>`;
  if (S.tab === "clients") return S.clientId ? (S.clientId === OFFICE ? officeView() : projectView(S.clientId)) : clientsView();
  if (S.tab === "ops") return S.audit ? auditView() : opsView();
  if (S.tab === "people") return S.workerId ? workerView(S.workerId) : peopleView();
  if (S.tab === "settings") return settingsView();
  return homeView();
}

/* one transaction row, used everywhere */
function opTitle(e){
  const t = e.type;
  if (t === "transfer") return `تحويل: ${esc(memberName(e.fromId))} ← ${esc(memberName(e.toId))}`;
  if (t === "fee") return `${esc(FEE_LABEL[e.feeKind] || "أتعاب المكتب")} · من ${esc(clientName(e.clientId))} إلى حساب المكتب`;
  if (t === "in"){
    if (e.clientId === OFFICE) return esc(CAT_LABEL[e.category] && e.category !== "other_in" ? CAT_LABEL[e.category] : "دخل للمكتب");
    const r = e.requestId && byId(S.requests, e.requestId);
    return `دفعة من الزبون${r ? ` · طلب N°${esc(reqNo(r))}` : ""}`;
  }
  if (e.clientId === OFFICE) return esc(CAT_LABEL[e.category] || "مصروف المكتب");
  const k = kindOf(e);
  if (k === "labor" && e.workerId){ const w = byId(S.workers, e.workerId); return `دفع لـ ${esc(w ? w.name : "عامل")}${w && w.specialty ? ` (${esc(w.specialty)})` : ""}`; }
  if (k === "material"){
    const q = e.qty ? ` · ${nf.format(e.qty)} ${esc(e.unit||"")}${e.unitPrice ? ` × ${nf.format(e.unitPrice)}` : ""}` : "";
    return `${esc(e.item || e.supplier || CAT_LABEL[e.category] || "مواد")}${q}`;
  }
  return esc(e.item || CAT_LABEL[e.category] || "مصروف");
}
function opRow(e, o={}){
  const t = e.type;
  const sign = t === "transfer" ? null : t === "fee" ? (o.ctx === OFFICE ? "in" : "out") : t;
  const ic = sign === "in" ? "+" : sign === "out" ? "−" : "⇄";
  const cls = sign || "transfer";
  const bits = [];
  if (!o.ctx && t !== "transfer" && t !== "fee") bits.push(esc(clientName(e.clientId)));
  if (t === "out" && e.clientId !== OFFICE) bits.push(esc(phaseName(e.phaseId)));
  if (e.category === "draw" && e.beneficiaryId) bits.push("لفائدة " + esc(memberName(e.beneficiaryId)));
  if (e.supplier && (e.item || kindOf(e) !== "material")) bits.push(esc(e.supplier));
  if (e.note) bits.push(esc(e.note));
  if (e.memberId) bits.push((t==="in" ? "استلمها: " : "دفعها: ") + esc(memberName(e.memberId)));
  bits.push("سجّلها: " + esc(personName(e.createdBy)));
  const n = (e.receipts||[]).length;
  return `<button class="op ${e.void?"void":""}" data-act="entry" data-id="${esc(e.id)}">
    <span class="ic ${cls}" aria-hidden="true">${ic}</span>
    <span class="t">${opTitle(e)}${e.void ? ' <span class="pill void">ملغاة</span>' : ""}</span>
    <span class="a ${cls}">${money(e.amount, sign)}</span>
    <span class="s">${bits.join(" · ")}</span>
    <span class="m">${n ? `<span title="مرفقات">${ICON_CLIP}${n}</span>` : ""}${o.timeOnly ? tm(e.at) : dt(e.at)}</span>
    ${o.extra || ""}
  </button>`;
}
function timeline(list, o={}){
  if (!list.length) return `<div class="empty">${o.empty || "لا توجد عمليات بعد."}</div>`;
  const groups = []; let g = null;
  for (const e of sortEntries(list)){ const k = fmtD(e.at); if (!g || g.k !== k){ g = {k, iso:e.at, items:[]}; groups.push(g); } g.items.push(e); }
  return `<div class="tl">${groups.map(g => `<div class="day"><span class="day-h">${esc(dayName(g.iso))} <span class="mono" dir="ltr">${g.k}</span></span><div class="ops">${g.items.map(e => opRow(e, {ctx:o.ctx, timeOnly:true, extra: o.rb ? `<span class="rb" style="grid-column:2/-1">الرصيد بعدها: ${money(o.rb[e.id])}</span>` : ""})).join("")}</div></div>`).join("")}</div>`;
}
function runningBalance(cid){
  const asc = entriesFor(cid).slice().sort((a,b) => (a.at||"").localeCompare(b.at||"") || (a.createdAt||"").localeCompare(b.createdAt||""));
  const rb = {}; let run = 0;
  for (const e of asc){ run += delta(e, cid); rb[e.id] = run; }
  return rb;
}

function holdingsHtml(h){

  keys.sort((a,b) => h[b]-h[a]);

  return `<div class="hold">${keys.map(k => `<div><span>${esc(memberName(k))}${k&&byId(S.members,k)?` <span class="pill">${esc(KIND[byId(S.members,k).kind]||"")}</span>`:""}</span><b class="${h[k]<0?"neg":""}">${money(h[k])}</b></div>`).join("")}<div class="tot"><span>المجموع</span><span>${money(sum)}</span></div></div>

function phasesHtml(cid){

  const rows = list.map(p => ({id:p.id, name:p.name, c:pc[p.id]}));
  if (pc[""]) rows.push({id:"", name:"بدون مرحلة", c:pc[""]});
  const max = Math.max(1, ...rows.map(r => r.c ? r.c.total : 0));
  return `<div class="phases">${rows.map((r,i) => `<button class="ph ${r.c?"":"zero"}" data-act="phase" data-ph="${esc(r.id||"none")}">

    <span class="ph-bar"><span style="width:${r.c ? (r.c.total/max*100).toFixed(1) : 0}%"></span></span>
    <span class="ph-v">${r.c ? money(r.c.total) : "—"}</span></button>`).join("")}</div>`;
}
function phaseView(c, phId){
  const list = S.entries.filter(e => e.clientId === c.id && e.type === "out" && (e.phaseId||"") === phId);

function filtered(){

    if (f.client && e.clientId !== f.client && !(f.client === OFFICE && e.type === "fee")) return false;
    if (f.member && e.memberId !== f.member && e.fromId !== f.member && e.toId !== f.member && e.beneficiaryId !== f.member) return false;
    if (f.month){ const d = new Date(e.at); if (`${d.getFullYear()}-${pad(d.getMonth()+1)}` !== f.month) return false; }
    if (q){ const hay = [e.note,e.supplier,e.ref,e.item,e.desc,CAT_LABEL[e.category],clientName(e.clientId),memberName(e.memberId),e.workerId?workerName(e.workerId):"",phaseName(e.phaseId),String(e.amount)].join(" ").toLowerCase(); if (!hay.includes(q)) return false; }
    return true;
  }));
}

function fmtVal(k, v){
  if (v === "" || v == null) return "فارغ";
  if (["amount","unitPrice","agreed","contract"].includes(k)) return nf.format(Number(v)||0);
  if (k === "at") return fmtDT(v);
  if (k === "clientId") return clientName(v);
  if (k === "phaseId") return phaseName(v);
  if (k === "workerId") return workerName(v);
  if (k === "requestId") { const r = byId(S.requests, v); return r ? "N°" + reqNo(r) : "—"; }
  if (["memberId","fromId","toId","beneficiaryId"].includes(k)) return memberName(v);
  if (k === "category") return CAT_LABEL[v] || v;
  if (k === "kind") return XKIND[v] || v;
  if (k === "type") return TYPE_LABEL[v] || v;
  if (k === "method") return METHOD_LABEL[v] || v;
  if (k === "feeKind") return FEE_LABEL[v] || v;
  if (k === "status") return STATUS[v] || v;
  if (k === "date" || k === "due" || k === "startDate") return ymdToFr(v);
  return String(v);
}
function histText(h){
  const ch = Object.keys(h.prev||{}).map(k => `${KEY_LABEL[k]||k} كان «${esc(fmtVal(k, h.prev[k]))}»`);

  if (h.action === "void") ch.push(`أُلغيت: ${esc(h.reason||"")}`);
  if (h.action === "restore") ch.push("أُعيد تفعيلها");
  if (h.action === "sent") ch.push("حُدِّد الطلب كمُرسَل");
  if (h.action === "cancel") ch.push(`أُلغي الطلب: ${esc(h.reason||"")}`);
  return ch.join("، ") || "تعديل";
}

/* ---------- team, workers, profit ---------- */
function profitCalc(){
  let officeIn = 0, fees = 0, overhead = 0; const draws = {};
  for (const e of active()){
    if (e.type === "fee"){ fees += e.amount; continue; }
    if (e.clientId !== OFFICE) continue;
    if (e.type === "in") officeIn += e.amount;
    else if (e.type === "out"){ if (e.category === "draw") draws[e.beneficiaryId||""] = (draws[e.beneficiaryId||""]||0) + e.amount; else overhead += e.amount; }
  }
  let doneLeft = 0; for (const c of S.clients) if (c.status === "done"){ const b = projStats(c.id).bal; if (b > 0) doneLeft += b; }
  return {officeIn, fees, overhead, dist: fees + officeIn - overhead, draws, doneLeft};
}

/* ---------- profiles ---------- */
async function resolveProfiles(){
  if (!S.user) return;
  const ids = new Set();
  const addH = list => { for (const h of list||[]) if (h.by) ids.add(h.by); };
  for (const e of S.entries){ if (e.createdBy) ids.add(e.createdBy); if (e.voidBy) ids.add(e.voidBy); if (e.updatedBy) ids.add(e.updatedBy); addH(e.history); }
  for (const r of S.requests){ if (r.createdBy) ids.add(r.createdBy); if (r.sentBy) ids.add(r.sentBy); addH(r.history); }
  for (const x of [...S.clients, ...S.workers, ...S.jobs]) addH(x.history);
  for (const m of S.members) if (m.userId) ids.add(m.userId);
  const need = [...ids].filter(id => !S.profAsked.has(id));
  if (!need.length) return;
  need.forEach(id => S.profAsked.add(id));
  try { const ps = await S.user.profiles(need); Object.assign(S.prof, ps); render(); } catch(_){}
}

/* ---------- receipts ---------- */
const okFile = f => /^image\//i.test(f.type||"") || /pdf/i.test(f.type||"") || /\.(pdf|jpe?g|png)$/i.test(f.name||"");
async function prepFile(f){
  const type = (f.type||"").toLowerCase();
  if (type === "application/pdf" || /\.pdf$/i.test(f.name)) return {blob:f, type:"application/pdf"};
  const native = /^image\/(jpeg|png)$/.test(type);
  try {
    const bmp = await createImageBitmap(f);
    const k = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, "image/jpeg", 0.82));
    if (b && (!native || b.size < f.size)) return {blob:b, type:"image/jpeg"};
  } catch(_){}
  if (!native) throw {code:"unsupported_type"};
  return {blob:f, type};
}
async function uploadFiles(files, onStep){
  const out = [];
  for (let i=0;i<files.length;i++){
    onStep && onStep(i+1, files.length);
    const p = await prepFile(files[i]);
    const r = await S.assets.upload(p.blob, {type:p.type});
    out.push({id:r.id, type:r.contentType, name:files[i].name||"", size:r.sizeBytes, at:new Date().toISOString(), by:S.me||null});
  }
  return out;
}

/* create or edit one transaction document; ids are fixed when the form opens so a retry can never write twice */
async function commitEntry(o){
  const {sh, editId, newId, data, pend, ctx} = o;
  const btn = $("[type=submit]", sh), err = $(".err", sh), label = btn.textContent;
  btn.disabled = true;
  const e = editId ? byId(S.entries, editId) : null;
  ctx.uploaded = ctx.uploaded || [];
  if (pend.length){
    try { const up = await uploadFiles(pend, (i,n) => { btn.textContent = `جارٍ رفع الملف ${i} من ${n}…`; }); ctx.uploaded = ctx.uploaded.concat(up); pend.length = 0; sh.querySelectorAll(".pend .thumb").forEach(t => t.remove()); }
    catch(x){ err.textContent = errMsg(x); btn.disabled = false; btn.textContent = label; return false; }
  }
  btn.textContent = "جارٍ الحفظ…";
  const now = new Date().toISOString();
  let ok;
  if (e){
    const receipts = (e.receipts||[]).concat(ctx.uploaded);
    const prev = diff(e, data, AUDIT_KEYS);
    const history = (e.history||[]).concat(Object.keys(prev).length || ctx.uploaded.length ? [{at:now, by:S.me||null, prev, added:ctx.uploaded.length}] : []);
    ok = await write(() => S.db.doc("entries/" + e.id).set({...strip(e), ...data, receipts, history, updatedAt:now, updatedBy:S.me||null}));
  } else {
    ok = await write(() => S.db.doc("entries/" + newId).set({...data, receipts:ctx.uploaded, createdAt:now, createdBy:S.me||null, history:[], void:false}));
  }
  if (ok){ closeModal(); toast(e ? "حُفظ التعديل" : (o.okMsg || `سُجّلت العملية ${fmtDT(now)}`)); return true; }
  btn.disabled = false; btn.textContent = label; return false;
}

      ${e ? `<div class="stamp">سُجّلت في ${dt(e.createdAt)} · التعديل يُحفظ في سجل التدقيق</div>` : ""}
      <div class="err" role="alert"></div>

    </form>`);
  const pend = bindPicker(sh), ctx = {};
  const cidOf = () => $("#pf-client", sh).value;

      <div class="k-material" style="display:flex;flex-direction:column;gap:12px">
        <label class="fld"><span>اسم المادة</span><input type="text" id="xf-item" list="dl-items" value="${esc(kind0==="material"?v.item||"":"")}" placeholder="مثال: حديد Ø12" autocomplete="off"></label>

        <label class="fld"><span>الوحدة</span><input type="text" id="xf-unit" list="dl-units" value="${esc(v.unit||"")}" placeholder="قضيب، كيس، m³…"></label></div>
        <label class="fld"><span>سعر الوحدة (${esc(cur())})</span><input type="text" inputmode="decimal" dir="ltr" id="xf-price" value="${esc(v.unitPrice??"")}" placeholder="1 250"></label>

        <div class="f2 new-w"><label class="fld"><span>اسم العامل الجديد</span><input type="text" id="xf-wname" autocomplete="off"></label><label class="fld"><span>التخصص</span><input type="text" id="xf-wspec" list="dl-spec" placeholder="حداد، بنّاء…"></label></div>
        <div class="f2"><label class="fld"><span>وصف العمل</span><input type="text" id="xf-jdesc" value="${esc(job0?job0.desc||"":"")}" placeholder="مثال: تسليح الأساسات"></label>
        <label class="fld"><span>المبلغ المتفق عليه (إن وجد)</span><input type="text" inputmode="decimal" dir="ltr" id="xf-agreed" value="${esc(job0&&job0.agreed?job0.agreed:"")}" placeholder="100 000"></label></div>
        <div class="calc" id="xf-calc"></div>
      </div>
      <div class="k-other"><label class="fld"><span>البيان</span><input type="text" id="xf-odesc" value="${esc(kind0==="other"?v.item||"":"")}" placeholder="مثال: نقل الرمل، كراء خلاطة"></label></div>
      <label class="fld"><span id="xf-amount-l">المبلغ الإجمالي (${esc(cur())})</span><input type="text" inputmode="decimal" dir="ltr" id="xf-amount" class="amt-in" value="${v.amount!==""?esc(String(v.amount)):""}" placeholder="0" autocomplete="off"></label>
      <div class="f2"><label class="fld k-sup"><span>المورد</span><input type="text" id="xf-sup" list="dl-sup" value="${esc(v.supplier||"")}" autocomplete="off"></label>
      <label class="fld"><span>طريقة الدفع</span>${methodSelect("xf-method", v.method)}</label></div>
      ${e && (e.receipts||[]).length ? `<div class="fld"><span>المرفقات</span><div class="thumbs">${e.receipts.map(r => thumbHtml(r,false)).join("")}</div></div>` : ""}
      ${receiptPicker()}
      ${whenHtml(e ? e.at : null)}
      ${more(`<label class="fld k-desc"><span>وصف اختياري</span><input type="text" id="xf-desc" value="${esc(kind0==="material"?v.desc||"":"")}"></label>
        <div class="f2"><label class="fld"><span>رقم الفاتورة</span><input type="text" id="xf-ref" value="${esc(v.ref||"")}" dir="auto"></label>
        <label class="fld"><span>من دفع المبلغ؟</span><select id="xf-member">${memberOpts(v.memberId)}</select></label></div>
        <label class="fld new-w"><span>هاتف العامل</span><input type="tel" dir="ltr" id="xf-wphone"></label>
        <label class="fld"><span>ملاحظات</span><textarea id="xf-note">${esc(v.note||"")}</textarea></label>`, !!(e && (e.ref || e.note || e.desc)))}
      <datalist id="dl-items">${items.slice(0,200).map(x => `<option value="${esc(x)}">`).join("")}</datalist>
      <datalist id="dl-units">${UNITS.map(x => `<option value="${esc(x)}">`).join("")}</datalist>
      <datalist id="dl-sup">${sups.slice(0,200).map(x => `<option value="${esc(x)}">`).join("")}</datalist>
      <datalist id="dl-spec">${SPECIALTIES.map(x => `<option value="${esc(x)}">`).join("")}</datalist>
      ${e ? `<div class="stamp">سُجّل في ${dt(e.createdAt)} · التعديل يُحفظ في سجل التدقيق</div>` : ""}
      <div class="err" role="alert"></div>
      <div class="foot"><button class="btn out" type="submit">${e ? "حفظ التعديل" : "حفظ المصروف"}</button><button class="btn" type="button" data-act="close">إلغاء</button></div>
    </form>`);
  const pend = bindPicker(sh), ctx = {};
  const kindNow = () => (sh.querySelector("input[name=xk]:checked")||{}).value || "material";
  const val = id => $("#"+id, sh).value;
  function jobNow(){ const w = val("xf-worker"); if (!w || w === "__new") return null; return byId(S.jobs, jobKey(val("xf-client"), val("xf-phase"), w)); }
  function sync(){
    const k = kindNow();
    sh.querySelectorAll(".k-material").forEach(x => x.hidden = k !== "material");
    sh.querySelectorAll(".k-labor").forEach(x => x.hidden = k !== "labor");
    sh.querySelectorAll(".k-other").forEach(x => x.hidden = k !== "other");
    sh.querySelectorAll(".k-desc").forEach(x => x.hidden = k !== "material");
    sh.querySelectorAll(".k-sup").forEach(x => x.hidden = k === "labor");
    const isNew = val("xf-worker") === "__new";
    sh.querySelectorAll(".new-w").forEach(x => x.hidden = !(k === "labor" && isNew));
    $("#xf-amount-l", sh).textContent = (k === "labor" ? "الدفعة الحالية" : "المبلغ الإجمالي") + ` (${cur()})`;
    calc();
  }
  function calc(){
    const k = kindNow();
    const a = $("#xf-amount", sh);
    if (k === "material"){
      const q = parseNum(val("xf-qty")), p = parseNum(val("xf-price"));
      if (q > 0 && p > 0){ a.value = String(Math.round(q*p*100)/100); a.readOnly = true; a.title = "محسوب تلقائيا: الكمية × سعر الوحدة"; }
      else { a.readOnly = false; a.title = ""; }
    } else { a.readOnly = false; a.title = ""; }
    if (k === "labor"){
      const j = jobNow();
      const agreed = parseNum(val("xf-agreed")) || 0;
      const before = j ? jobPaid(j.id, editId) : 0;
      const now = parseNum(val("xf-amount")) || 0;
      const after = before + now;
      $("#xf-calc", sh).innerHTML = `<div><span>المتفق عليه</span><b>${agreed ? money(agreed) : "—"}</b></div><div><span>قبض سابقا</span><b>${money(before)}</b></div><div><span>الدفعة الحالية</span><b>${money(now)}</b></div><div class="hl"><span>إجمالي المقبوض بعدها</span><b>${money(after)}</b></div><div><span>المتبقي له</span><b class="${agreed && agreed-after<0?"neg":""}">${agreed ? money(agreed - after) : "—"}</b></div>`;
    }
  }
  function onWorkerOrPhase(){
    const j = jobNow();
    if (j){ $("#xf-jdesc", sh).value = j.desc || ""; $("#xf-agreed", sh).value = j.agreed || ""; }
    else if (!e){ $("#xf-jdesc", sh).value = ""; $("#xf-agreed", sh).value = ""; }
    sync();
  }
  sync();
  sh.addEventListener("change", ev => {
    const id = ev.target.id;
    if (ev.target.name === "xk") sync();
    else if (id === "xf-worker" || id === "xf-phase" || id === "xf-client") onWorkerOrPhase();
    else if (id === "xf-item"){
      const last = sortEntries(S.entries).find(x => x.type === "out" && x.item === ev.target.value && x.unitPrice);
      if (last){ if (!val("xf-unit")) $("#xf-unit", sh).value = last.unit || ""; if (!val("xf-price")) $("#xf-price", sh).value = last.unitPrice; if (!val("xf-sup") && last.supplier) $("#xf-sup", sh).value = last.supplier; calc(); }
    }
  });
  sh.addEventListener("input", ev => { if (["xf-qty","xf-price","xf-amount","xf-agreed"].includes(ev.target.id)) calc(); });
  $("form", sh).addEventListener("submit", async ev => {
    ev.preventDefault();
    const err = $(".err", sh); err.textContent = "";
    const btn = $("[type=submit]", sh);
    if (btn.disabled) return;
    const k = kindNow(), cid = val("xf-client"), ph = val("xf-phase");
    if (!cid) { err.textContent = "اختاروا المشروع."; return; }
    const amount = parseNum(val("xf-amount"));
    if (!(amount > 0)) { err.textContent = k === "labor" ? "أدخلوا مبلغ الدفعة الحالية." : "أدخلوا المبلغ، أو الكمية وسعر الوحدة."; return; }
    const at = readWhen(sh, e && e.at); if (!at) { err.textContent = "التاريخ أو الساعة غير صحيح."; return; }
    const base = {type:"out", kind:k, clientId:cid, phaseId:ph, amount, at, method:val("xf-method"), ref:val("xf-ref").trim(), note:val("xf-note").trim(), memberId:val("xf-member"),
      item:"", desc:"", qty:"", unit:"", unitPrice:"", supplier:"", workerId:"", jobId:"", category: k === "material" ? "materials" : k === "labor" ? "labor" : "other_out"};
    if (k === "material"){
      const item = val("xf-item").trim(); if (!item) { err.textContent = "اكتبوا اسم المادة."; return; }
      const q = parseNum(val("xf-qty")), p = parseNum(val("xf-price"));
      Object.assign(base, {item, desc:val("xf-desc").trim(), qty: q > 0 ? q : "", unit:val("xf-unit").trim(), unitPrice: p > 0 ? p : "", supplier:val("xf-sup").trim()});
    } else if (k === "other"){
      const item = val("xf-odesc").trim(); if (!item) { err.textContent = "اكتبوا بيان المصروف."; return; }
      Object.assign(base, {item, supplier:val("xf-sup").trim()});
    } else {
      let wid = val("xf-worker");
      if (!wid) { err.textContent = "اختاروا العامل أو أضيفوا عاملا جديدا."; return; }
      const agreedRaw = val("xf-agreed").trim(); const agreed = agreedRaw ? parseNum(agreedRaw) : 0;
      if (agreedRaw && !(agreed >= 0)) { err.textContent = "المبلغ المتفق عليه غير صحيح."; return; }
      btn.disabled = true;
      const now = new Date().toISOString();
      if (wid === "__new"){
        const name = val("xf-wname").trim(); if (!name) { err.textContent = "اكتبوا اسم العامل الجديد."; btn.disabled = false; return; }
        const same = S.workers.find(w => w.name.trim() === name && w.id !== newWorkerId);
        if (same && !ctx.confirmDup){ ctx.confirmDup = true; err.textContent = `يوجد عامل باسم «${name}». اختاروه من القائمة، أو اضغطوا حفظ مرة أخرى لإضافة عامل جديد بنفس الاسم.`; btn.disabled = false; return; }
        if (!byId(S.workers, newWorkerId)){
          if (!await write(() => S.db.doc("workers/" + newWorkerId).set({name, specialty:val("xf-wspec").trim(), phone:val("xf-wphone").trim(), notes:"", createdAt:now, createdBy:S.me||null, history:[]}))) { btn.disabled = false; return; }
        }
        wid = newWorkerId;
      }
      const jid = jobKey(cid, ph, wid), job = byId(S.jobs, jid), desc = val("xf-jdesc").trim();
      if (!job){
        if (!await write(() => S.db.doc("jobs/" + jid).set({workerId:wid, clientId:cid, phaseId:ph, desc, agreed, createdAt:now, createdBy:S.me||null, history:[]}))) { btn.disabled = false; return; }
      } else if ((Number(job.agreed)||0) !== agreed || (job.desc||"") !== desc){
        const prev = diff(job, {agreed, desc}, ["agreed","desc"]);
        if (!await write(() => S.db.doc("jobs/" + jid).update({agreed, desc, updatedAt:now, updatedBy:S.me||null, history:(job.history||[]).concat([{at:now, by:S.me||null, prev}])}))) { btn.disabled = false; return; }
      }
      btn.disabled = false;
      Object.assign(base, {workerId:wid, jobId:jid, desc});
    }
    await commitEntry({sh, editId, newId, data:base, pend, ctx, okMsg:`سُجّل المصروف · ${fmtDT(at)}`});
  });
}

/* sequential numbers: a short lease on counters/requests serialises numbering across devices, and the document id is the number itself */
async function createRequest(data){
  const lease = S.db.doc("counters/requests");
  let got = false;
  for (let i = 0; i < 6 && !got; i++){ const a = await lease.acquire({holder:TAB_ID, ttlMs:10000}); got = a.acquired; if (!got) await sleep(800); }
  if (!got) throw {code:"busy"};
  const snap = await S.db.collection("requests").get();
  let no = 0; for (const d of snap.docs) no = Math.max(no, Number(d.data().no) || 0);
  no++;
  let id;
  for (;;){ id = "r" + String(no).padStart(4,"0"); const ex = await S.db.doc("requests/" + id).get(); if (!ex.exists) break; no++; }
  await S.db.doc("requests/" + id).set({...data, no, sentAt:"", cancelled:false, pdfs:[], createdAt:new Date().toISOString(), createdBy:S.me||null, history:[]});
  return id;
}

/* ---------- PDF: the document is drawn on an A4 canvas (Arabic shaping comes from the browser), then wrapped in a one-page PDF ---------- */
let PDF_CACHE = null;
const loadImg = src => new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
async function requestCanvas(r){
  try { await Promise.all([document.fonts.load('400 30px "IBM Plex Sans Arabic"'), document.fonts.load('700 30px "IBM Plex Sans Arabic"')]); } catch(_){}
  const W = 1654, H = 2339, k = W / 210;
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const g = cv.getContext("2d");
  g.fillStyle = "#ffffff"; g.fillRect(0, 0, W, H);
  const INK = "#1A201D", MUTE = "#5B655E", ACC = "#24479A", LINE = "#C9CEC7", SOFT = "#EEF1F7";
  const clean = s => String(s ?? "").replace(/[  ]/g, " ");
  const font = (sz, wt) => `${wt||400} ${sz*k}px "IBM Plex Sans Arabic", Arial, sans-serif`;
  const pm = n => clean(nf2.format(Number(n)||0)) + " " + curCode();
  function txt(s, x, y, o={}){ s = clean(s); g.font = font(o.size||3.4, o.w); g.fillStyle = o.color || INK; g.direction = /[؀-ۿ]/.test(s) ? "rtl" : "ltr"; g.textAlign = o.align || "left"; g.textBaseline = "alphabetic"; g.fillText(s, x*k, y*k); }
  function wrap(s, x, y, w, o={}){
    g.font = font(o.size||3.4, o.w); const lh = (o.size||3.4) * 1.5; let yy = y;
    for (const para of clean(s).split(/\n/)){
      let line = "";
      for (const word of para.split(/\s+/)){ const t = line ? line + " " + word : word; if (g.measureText(t).width > w*k && line){ txt(line, x, yy, o); yy += lh; line = word; } else line = t; }
      txt(line, x, yy, o); yy += lh;
    }
    return yy;
  }
  const rect = (x, y, w, h, fill, stroke) => { if (fill){ g.fillStyle = fill; g.fillRect(x*k, y*k, w*k, h*k); } if (stroke){ g.strokeStyle = stroke; g.lineWidth = 0.3*k; g.strokeRect(x*k, y*k, w*k, h*k); } };
  const hline = (y, x1=16, x2=194, c=LINE) => { g.strokeStyle = c; g.lineWidth = 0.3*k; g.beginPath(); g.moveTo(x1*k, y*k); g.lineTo(x2*k, y*k); g.stroke(); };
  const s = S.settings, c = byId(S.clients, r.clientId) || {};
  const snap = r.snap || (() => { const st = projStats(r.clientId); return {paid:st.paid, spent:st.out, bal:st.bal, contract:st.contract}; })();
  const logo = s.logoId ? await loadImg("/_blob/" + s.logoId) : null;
  if (logo){ const sc = Math.min(26*k / logo.width, 26*k / logo.height); g.drawImage(logo, 16*k, 14*k, logo.width*sc, logo.height*sc); }
  else {
    g.fillStyle = ACC; g.beginPath(); if (g.roundRect) g.roundRect(16*k, 14*k, 22*k, 22*k, 4*k); else g.rect(16*k, 14*k, 22*k, 22*k); g.fill();
    g.strokeStyle = "#ffffff"; g.lineWidth = 1.3*k; g.lineJoin = "round"; g.lineCap = "round"; g.beginPath();
    const X = v => (16 + v*22/34)*k, Y = v => (14 + v*22/34)*k;
    g.moveTo(X(8),Y(25)); g.lineTo(X(8),Y(14)); g.lineTo(X(17),Y(8)); g.lineTo(X(26),Y(14)); g.lineTo(X(26),Y(25)); g.moveTo(X(13),Y(25)); g.lineTo(X(13),Y(19)); g.lineTo(X(21),Y(19)); g.lineTo(X(21),Y(25)); g.moveTo(X(8),Y(25)); g.lineTo(X(26),Y(25)); g.stroke();
  }
  let y = 19;
  txt(s.company || "Entreprise de bâtiment", 46, y, {size:5, w:700}); y += 5.5;
  for (const l of [s.activity, s.address, [s.phone ? "Tél : " + s.phone : "", s.email].filter(Boolean).join("  ·  "), s.legal].filter(Boolean)){ txt(l, 46, y, {size:3, color:MUTE}); y += 4.4; }
  const ty = Math.max(y, 40) + 4;
  hline(ty);
  txt("DEMANDE DE VERSEMENT", 16, ty + 10, {size:5.6, w:700, color:ACC});
  txt(`N° ${reqNo(r)}`, 194, ty + 10, {size:5, w:700, align:"right"});
  txt(`Date : ${ymdToFr(r.date)}`, 194, ty + 16, {size:3.4, align:"right"});
  if (r.due) txt(`Échéance : ${ymdToFr(r.due)}`, 194, ty + 21, {size:3.2, color:MUTE, align:"right"});
  const by = ty + 27;
  rect(16, by, 86, 30, null, LINE); rect(108, by, 86, 30, null, LINE);
  txt("CLIENT", 20, by + 6, {size:2.8, w:700, color:ACC});
  txt(c.name || "", 20, by + 13, {size:4, w:700});
  let cy = by + 19; for (const l of [c.phone].filter(Boolean)){ txt(l, 20, cy, {size:3.1, color:MUTE}); cy += 4.6; }
  txt("PROJET", 112, by + 6, {size:2.8, w:700, color:ACC});
  wrap(c.project || "—", 112, by + 13, 78, {size:3.8, w:700});
  if (c.location) txt(c.location, 112, by + 25, {size:3.1, color:MUTE});
  let fy = by + 40;
  txt("SITUATION FINANCIÈRE DU PROJET", 16, fy, {size:2.8, w:700, color:ACC}); fy += 3;
  const lines = [];
  if (snap.contract) lines.push(["Montant du marché", pm(snap.contract)]);
  lines.push(["Total des versements reçus", pm(snap.paid)]);
  lines.push(["Dépenses engagées sur le projet", pm(snap.spent)]);
  lines.push(["Solde actuel du projet", pm(snap.bal)]);
  for (const [a, b] of lines){ rect(16, fy, 178, 9, null, LINE); txt(a, 20, fy + 6, {size:3.4}); txt(b, 190, fy + 6, {size:3.4, w:700, align:"right"}); fy += 9; }
  rect(16, fy, 178, 13, ACC); txt("MONTANT DEMANDÉ", 20, fy + 8.6, {size:4, w:700, color:"#ffffff"}); txt(pm(r.amount), 190, fy + 8.8, {size:5, w:700, color:"#ffffff", align:"right"}); fy += 22;
  txt("OBJET", 16, fy, {size:2.8, w:700, color:ACC}); fy = wrap(r.reason || DEFAULT_REASON, 16, fy + 6, 178, {size:3.6}) + 3;
  if (r.notes){ txt("OBSERVATIONS", 16, fy, {size:2.8, w:700, color:ACC}); fy = wrap(r.notes, 16, fy + 6, 178, {size:3.4}) + 3; }
  if (s.payInfo){
    txt("MODALITÉS DE PAIEMENT", 16, fy, {size:2.8, w:700, color:ACC});
    const n = clean(s.payInfo).split(/\n/).length;
    const hgt = Math.max(12, n * 5.2 + 6);
    rect(16, fy + 3, 178, hgt, SOFT);
    wrap(s.payInfo, 20, fy + 9, 170, {size:3.3}); fy += hgt + 8;
  }
  const sy = Math.min(Math.max(fy + 4, 232), 244);
  rect(16, sy, 84, 36, null, LINE); rect(110, sy, 84, 36, null, LINE);
  txt("Le client (lu et approuvé)", 20, sy + 6, {size:3, color:MUTE});
  txt("Cachet et signature", 114, sy + 6, {size:3, color:MUTE});
  hline(283);
  txt([s.company, s.phone, s.email].filter(Boolean).join("  ·  "), 16, 288, {size:2.7, color:MUTE});
  txt(`Document généré le ${fmtDT(new Date().toISOString())}`, 194, 288, {size:2.7, color:MUTE, align:"right"});
  return cv;
}
async function canvasToPdf(cv){
  const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.9));
  const img = new Uint8Array(await blob.arrayBuffer());
  const te = new TextEncoder(); const parts = []; const offs = []; let len = 0;
  const push = b => { const u = typeof b === "string" ? te.encode(b) : b; parts.push(u); len += u.length; };
  const obj = (n, ...body) => { offs[n] = len; push(`${n} 0 obj\n`); body.forEach(push); push("\nendobj\n"); };
  push("%PDF-1.4\n%âãÏÓ\n");
  obj(1, "<< /Type /Catalog /Pages 2 0 R >>");
  obj(2, "<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
  obj(3, "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 5 0 R >> /ProcSet [/PDF /ImageC] >> /Contents 4 0 R >>");
  const cs = "q\n595.28 0 0 841.89 0 0 cm\n/Im0 Do\nQ";
  obj(4, `<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
  obj(5, `<< /Type /XObject /Subtype /Image /Width ${cv.width} /Height ${cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>\nstream\n`, img, "\nendstream");
  const xref = len;
  let x = "xref\n0 6\n0000000000 65535 f \n";
  for (let i = 1; i <= 5; i++) x += String(offs[i]).padStart(10, "0") + " 00000 n \n";
  push(x + `trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts, {type:"application/pdf"});
}

async function downloadPdf(id){
  const r = byId(S.requests, id); if (!r) return;
  try {
    const cv = PDF_CACHE && PDF_CACHE.id === id ? PDF_CACHE.cv : await requestCanvas(r);
    const blob = await canvasToPdf(cv);
    const dl = await useCap("downloads");
    if (!dl){ toast("التنزيل غير متاح في هذه النافذة.", true); return; }
    await dl.save({filename:`Demande-de-versement-N${reqNo(r)}.pdf`, data:blob});
  } catch(e){ if (!e || e.code !== "declined") toast("تعذّر حفظ الملف.", true); }
}
