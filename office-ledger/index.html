      <div class="foot"><button class="btn pri" type="submit">حفظ</button><button class="btn" type="button" data-act="close">إلغاء</button></div>
    </form>`);
  $("form", sh).addEventListener("submit", async ev => {
    ev.preventDefault();
    const name = $("#wf-name", sh).value.trim(); if (!name) { $(".err", sh).textContent = "اكتبوا الاسم."; return; }
    const body = {name, specialty:$("#wf-spec", sh).value.trim(), phone:$("#wf-phone", sh).value.trim(), notes:$("#wf-notes", sh).value.trim()};
    const now = new Date().toISOString();
    $("[type=submit]", sh).disabled = true;
    let ok;
    if (w){ const prev = diff(w, body, Object.keys(body)); ok = await write(() => S.db.doc("workers/"+w.id).set({...strip(w), ...body, updatedAt:now, updatedBy:S.me||null, history:(w.history||[]).concat(Object.keys(prev).length ? [{at:now, by:S.me||null, prev}] : [])})); }
    else ok = await write(() => S.db.doc("workers/"+newId).set({...body, createdAt:now, createdBy:S.me||null, history:[]}));
    if (ok){ closeModal(); toast("حُفظ"); } else $("[type=submit]", sh).disabled = false;
  });
}

/* ---------- receipt viewer ---------- */
function receiptView(rid, type, eid){
  const isPdf = /pdf/.test(type);
  openModal(`${sheetHead(isPdf ? "ملف PDF" : "الفاتورة")}
    ${isPdf ? `<iframe src="/_blob/${esc(rid)}" title="ملف PDF"></iframe><a class="btn" href="/_blob/${esc(rid)}" target="_blank" rel="noopener">فتح الملف في نافذة جديدة</a>` : `<img src="/_blob/${esc(rid)}" alt="صورة الفاتورة">`}
    <div class="foot"><button class="btn" data-act="save-receipt" data-rid="${esc(rid)}" data-rtype="${esc(type)}">حفظ نسخة على الجهاز</button>${eid?`<button class="btn" data-act="entry" data-id="${esc(eid)}">رجوع للعملية</button>`:`<button class="btn" data-act="close">إغلاق</button>`}</div>`, "lb");
}
async function saveReceipt(rid, type){
  try {
    const dl = await useCap("downloads"); if (!dl) { toast("الحفظ على الجهاز غير متاح هنا.", true); return; }
    const b = await (await fetch("/_blob/" + rid)).blob();
    const ext = /pdf/.test(type) ? "pdf" : /png/.test(type) ? "png" : "jpg";
    await dl.save({filename:`facture-${rid.slice(0,8)}.${ext}`, data:b});
  } catch(e){ if (!e || e.code !== "declined") toast("تعذّر حفظ الملف.", true); }
}

/* ---------- export ---------- */
async function exportCsv(list, tag){
  const q = s => `"${String(s??"").replace(/"/g,'""')}"`;
  const head = ["التاريخ","الساعة","النوع","الحساب","المرحلة","نوع المصروف","البيان","الكمية","الوحدة","سعر الوحدة","العامل","المبلغ","طريقة الدفع","استلم/دفع","من","إلى","لفائدة","المورد","المرجع","طلب الدفع","ملاحظة","عدد المرفقات","الحالة","سبب الإلغاء","سجّلها","وقت التسجيل"];
  const rows = list.map(e => {
    const signed = e.type === "out" || (e.type === "fee" && tag !== OFFICE) ? -e.amount : e.amount;
    const r = e.requestId && byId(S.requests, e.requestId);
    return [fmtD(e.at), fmtT(e.at), e.type==="fee"?"أتعاب للمكتب":TYPE_LABEL[e.type], e.type==="transfer"?"":clientName(e.clientId), e.type==="out"&&e.clientId!==OFFICE?phaseName(e.phaseId):"", e.type==="out"&&e.clientId!==OFFICE?XKIND[kindOf(e)]:"", e.item||(e.type==="fee"?FEE_LABEL[e.feeKind]:CAT_LABEL[e.category])||"", e.qty||"", e.unit||"", e.unitPrice||"", e.workerId?workerName(e.workerId):"", signed.toFixed(2), METHOD_LABEL[e.method]||"", e.memberId?memberName(e.memberId):"", e.fromId?memberName(e.fromId):"", e.toId?memberName(e.toId):"", e.beneficiaryId?memberName(e.beneficiaryId):"", e.supplier||"", e.ref||"", r?"N°"+reqNo(r):"", e.note||"", (e.receipts||[]).length, e.void?"ملغاة":"سارية", e.voidReason||"", personName(e.createdBy), fmtDT(e.createdAt)];
  });
  const csv = "﻿" + [head, ...rows].map(r => r.map(q).join(",")).join("\r\n");
  const d = new Date(); const fn = `operations-${tag && tag !== OFFICE ? "projet-" : ""}${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.csv`;
  try { const dl = await useCap("downloads"); if (dl){ await dl.save({filename:fn, data:csv}); return; } } catch(e){ if (e && e.code === "declined") return; }
  openModal(`${sheetHead("نسخ البيانات")}<p class="muted" style="margin:0">الحفظ المباشر غير متاح هنا. انسخوا النص والصقوه في Excel.</p><textarea id="csv-t" style="min-height:240px" dir="ltr" readonly>${esc(csv.slice(1))}</textarea><div class="foot"><button class="btn pri" data-act="copy-csv">نسخ</button><button class="btn" data-act="close">إغلاق</button></div>`);
}

/* ---------- settings & phases actions ---------- */
function phDraft(){ if (!S.phDraft) S.phDraft = phaseList().map(p => ({id:p.id, name:p.name, hidden:!!p.hidden})); return S.phDraft; }
async function saveSettings(){
  const d = {...S.settings, ...(S.setDraft||{})};
  const low = d.lowPct === "" || d.lowPct == null ? 10 : parseNum(d.lowPct);
  if (!(low >= 0 && low <= 100)) { toast("حد التنبيه بين 0 و 100.", true); return; }
  const body = {...d, lowPct:low, currency:(d.currency||"").trim() || "دج", currencyCode:(d.currencyCode||"").trim() || "DZD"};
  if (await write(() => S.db.doc("settings/main").set(body))) { S.setDraft = null; toast("حُفظت الإعدادات"); }
}
async function savePhases(){
  const list = S.phDraft; if (!list) return;
  if (list.some(p => !p.name.trim())) { toast("لكل مرحلة اسم. أكملوا الأسماء الفارغة.", true); return; }
  if (await write(() => S.db.doc("settings/phases").set({list:list.map(p => ({id:p.id, name:p.name.trim(), hidden:!!p.hidden})), updatedAt:new Date().toISOString(), updatedBy:S.me||null}))) { S.phDraft = null; toast("حُفظت المراحل"); draw(); }
}

/* ---------- events ---------- */
document.addEventListener("click", async ev => {
  const scrim = ev.target.closest("[data-scrim]"); if (scrim && ev.target === scrim) { closeModal(); return; }
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  const cidOf = () => el.dataset.client || currentProject();
  const phOf = () => { const p = el.dataset.phase; if (p === undefined || p === "") return S.pview === "phase" && currentProject() && currentProject() === cidOf() ? S.phaseId : undefined; return p === "none" ? "" : p; };
  switch (a){
    case "tab": closeModal(); go({tab:el.dataset.tab, clientId:null, workerId:null, pview:"dash", audit:false}); break;
    case "client": closeModal(); go({tab:"clients", clientId:id, pview:"dash"}); break;
    case "back": go({clientId:null, pview:"dash"}); break;
    case "pview": go({pview:el.dataset.v}); break;
    case "phase": { closeModal(); const ph = el.dataset.ph === "none" ? "" : el.dataset.ph; go({tab:"clients", clientId:el.dataset.client || S.clientId, pview:"phase", phaseId:ph}); break; }
    case "worker": closeModal(); go({tab:"people", workerId:id}); break;
    case "worker-back": go({workerId:null}); break;
    case "new-entry": chooser(); break;
    case "pay": paymentForm({clientId:cidOf()}); break;
    case "expense": expenseForm({clientId:cidOf(), kind:el.dataset.kind, phaseId:phOf()}); break;
    case "fee": feeForm({clientId:cidOf()}); break;
    case "office-entry": entryForm({type:el.dataset.type}); break;
    case "new-request": requestForm(cidOf()); break;
    case "request": requestDetail(id); break;
    case "req-pdf": showPdf(id); break;
    case "pdf-download": downloadPdf(id); break;
    case "req-sent": el.disabled = true; await markSent(id); break;
    case "req-pay": { const r = byId(S.requests, id); if (r) paymentForm({clientId:r.clientId, requestId:id, amount:Math.max(r.amount - reqPaid(id), 0)}); break; }
    case "req-edit": requestForm(null, id); break;
    case "req-cancel": $("#rq-box").innerHTML = `<div class="card" style="border-color:var(--out)"><label class="fld"><span>سبب إلغاء الطلب</span><input type="text" id="rq-r"></label><div class="err" id="rq-err"></div><div class="row"><button class="btn out" data-act="req-cancel-ok" data-id="${esc(id)}">تأكيد الإلغاء</button><button class="btn" data-act="req-cancel-no">تراجع</button></div></div>`; $("#rq-r").focus(); break;
    case "req-cancel-no": $("#rq-box").innerHTML = ""; break;
    case "req-cancel-ok": {
      const reason = $("#rq-r").value.trim(); if (!reason) { $("#rq-err").textContent = "اكتبوا سبب الإلغاء."; return; }
      const r = byId(S.requests, id), now = new Date().toISOString();
      if (await write(() => S.db.doc("requests/"+id).update({cancelled:true, cancelReason:reason, cancelledAt:now, cancelledBy:S.me||null, history:(r.history||[]).concat([{at:now, by:S.me||null, prev:{}, action:"cancel", reason}])}))) { toast("أُلغي الطلب وبقي في السجل"); await until(() => byId(S.requests, id)?.cancelled); requestDetail(id); }
      break; }
    case "entry": entryDetail(id); break;
    case "edit-entry": editEntry(id); break;
    case "void": voidBox(id); break;
    case "void-no": $("#void-box").innerHTML = ""; break;
    case "void-ok": {
      const r = $("#void-r").value.trim(); if (!r) { $("#void-err").textContent = "اكتبوا سبب الإلغاء."; return; }
      const e = byId(S.entries, id); const now = new Date().toISOString();
      if (await write(() => S.db.doc("entries/"+id).update({void:true, voidReason:r, voidAt:now, voidBy:S.me||null, history:(e.history||[]).concat([{at:now, by:S.me||null, prev:{}, action:"void", reason:r}])}))) { closeModal(); toast("أُلغيت العملية وبقيت في السجل"); }
      break; }
    case "restore": {
      const e = byId(S.entries, id); const now = new Date().toISOString();
      if (await write(() => S.db.doc("entries/"+id).update({void:false, history:(e.history||[]).concat([{at:now, by:S.me||null, prev:{}, action:"restore"}])}))) { closeModal(); toast("أُعيد تفعيل العملية"); }
      break; }
    case "receipt": receiptView(el.dataset.rid, el.dataset.rtype, el.dataset.eid); break;
    case "save-receipt": saveReceipt(el.dataset.rid, el.dataset.rtype); break;
    case "new-client": clientForm(); break;
    case "edit-client": clientForm(id); break;
    case "del-client": {
      if (el.dataset.sure){ if (await write(() => S.db.doc("clients/"+id).delete())) { go({clientId:null, pview:"dash"}); toast("حُذف الزبون"); } }
      else { el.dataset.sure = "1"; el.textContent = "اضغطوا مرة أخرى لتأكيد الحذف"; }
      break; }
    case "new-member": memberForm(); break;
    case "edit-member": if (!S.readOnly) memberForm(id); break;
    case "del-member": {
      if (el.dataset.sure){ if (await write(() => S.db.doc("members/"+id).delete())) { closeModal(); toast("حُذف"); } }
      else { el.dataset.sure = "1"; el.textContent = "اضغطوا مرة أخرى للتأكيد"; }
      break; }
    case "new-worker": workerForm(); break;
    case "edit-worker": workerForm(id); break;
    case "del-worker": {
      if (el.dataset.sure){ if (await write(() => S.db.doc("workers/"+id).delete())) { go({workerId:null}); toast("حُذف العامل"); } }
      else { el.dataset.sure = "1"; el.textContent = "اضغطوا مرة أخرى للتأكيد"; }
      break; }
    case "save-settings": saveSettings(); break;
    case "logo-remove": if (await write(() => S.db.doc("settings/main").set({...S.settings, logoId:""}))) toast("أُزيل الشعار"); break;
    case "ph-up": case "ph-down": { const l = phDraft(), i = Number(el.dataset.i), j = a === "ph-up" ? i-1 : i+1; if (j >= 0 && j < l.length){ [l[i], l[j]] = [l[j], l[i]]; } draw(); break; }
    case "ph-hide": { const l = phDraft(); l[Number(el.dataset.i)].hidden = !l[Number(el.dataset.i)].hidden; draw(); break; }
    case "ph-add": { const n = (S.phNew||"").trim(); if (!n) { toast("اكتبوا اسم المرحلة الجديدة.", true); return; } phDraft().push({id:"p" + Math.random().toString(36).slice(2,9), name:n, hidden:false}); S.phNew = ""; draw(); break; }
    case "ph-save": savePhases(); break;
    case "ph-reset": S.phDraft = null; draw(); break;
    case "audit": go({audit:!S.audit}); break;
    case "export": exportCsv(filtered()); break;
    case "export-client": { const c = el.dataset.client; exportCsv(sortEntries(entriesFor(c)), c); break; }
    case "copy-csv": { const t = $("#csv-t"); try { await navigator.clipboard.writeText(t.value); toast("نُسخ"); } catch(_){ t.select(); } break; }
    case "clear-f": S.f = {q:"", type:"", client:"", member:"", month:""}; draw(); break;
    case "close": closeModal(); break;
  }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && $("#modal-root").innerHTML) closeModal();
  if (ev.key === "Enter" && ev.target.matches && ev.target.matches("tr[data-act]")) ev.target.click();
});
$("#main").addEventListener("input", ev => {
  const t = ev.target;
  const map = {fq:"q", ft:"type", fc:"client", fm:"member", fmo:"month"};
  if (map[t.id]) { S.f[map[t.id]] = t.value; draw(); }
  else if (t.id === "cq") { S.cq = t.value; draw(); }
  else if (t.id && t.id.startsWith("st-")) { S.setDraft = {...(S.setDraft||{}), [t.id.slice(3)]: t.value}; }
  else if (t.id && t.id.startsWith("ph-n-")) { const p = phDraft().find(x => x.id === t.id.slice(5)); if (p) p.name = t.value; }
  else if (t.id === "ph-new") S.phNew = t.value;
});
$("#main").addEventListener("change", async ev => {
  if (ev.target.id !== "logo-in" || !ev.target.files[0]) return;
  const f = ev.target.files[0]; ev.target.value = "";
  try { const [up] = await uploadFiles([f]); if (await write(() => S.db.doc("settings/main").set({...S.settings, logoId:up.id}))) toast("حُفظ الشعار"); }
  catch(x){ toast(errMsg(x), true); }
});

/* ---------- boot ---------- */
async function boot(){
  draw();
  try { new ResizeObserver(() => document.documentElement.style.setProperty("--hdr-h", $(".top").offsetHeight + "px")).observe($(".top")); } catch(_){}
  const [db, user, assets] = await Promise.all([useCap("db"), useCap("user"), useCap("assets")]);
  S.user = user; S.assets = assets;
  if (!db){ S.noDb = true; draw(); return; }
  S.db = db;
  if (user){
    try { S.meProfile = await user.me(); S.me = S.meProfile.id; } catch(_){}
    try { const c = await user.can("data.write"); if (c === false) S.readOnly = true; } catch(_){}
    try { S.canEdit = !!(await user.canEdit()); } catch(_){}
  }
  const done = k => { S.loaded[k] = true; if (Object.values(S.loaded).every(Boolean)) S.ready = true; render(); };
  const onErr = e => { if (e && (e.code === "revoked" || e.code === "not_granted")) S.readOnly = true; S.ready = true; toast("تعذّر تحميل جزء من الدفتر. أعيدوا فتح الصفحة.", true); render(); };
  const num = d => { const x = d.data(); return {id:d.id, ...x, amount:Number(x.amount)||0}; };
  const sub = (name, map) => db.collection(name).onSnapshot(s => { S[name] = s.docs.map(map || (d => ({id:d.id, ...d.data()}))); done(name); }, onErr);
  sub("clients"); sub("members"); sub("workers"); sub("jobs"); sub("requests", num); sub("entries", num);
  db.doc("settings/main").onSnapshot(s => { S.settings = s.exists ? s.data() : {}; render(); }, () => {});
  db.doc("settings/phases").onSnapshot(s => { S.phasesDoc = s.exists ? s.data() : null; render(); }, () => {});
}
if (window.__LEDGER_TEST__) window.__ledger = {S, projStats, clientTotals, companyTotals, reqStatus, reqPaid, jobPaid, workerStats, phaseCosts, suggestAmount, outstanding, parseNum, requestCanvas, canvasToPdf, profitCalc};
boot();
})();
</script>
